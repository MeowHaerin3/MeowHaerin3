  /* ═══ Google Drive sync ═════════════════════════════════════
     Drive has create_file but no update_file, so every push writes a
     new dated file and a pull reads the newest one back. Pull runs on
     open; push is always a button press. */
  var DRIVE = "Google Drive";
  var SYNC_PREFIX = "todo-board-sync-";
  var sync = { busy: false, checked: false, off: false, err: "", driveAt: 0 };

  function mcpReady() { return !!(window.claude && window.claude.mcp); }

  function b64decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* Lifecycle codes mean MCP will never work in this view — hide the
     feature rather than nagging about it. */
  function syncDead(err) {
    var c = err && err.code;
    return c === "not_granted" || c === "capability_disabled" || c === "capability_removed";
  }

  /* Each code has a different fix, so each gets its own message. */
  function syncErrText(err, isWrite, server) {
    var c = err && err.code;
    var v = { s: server || (err && err.server) || DRIVE };
    if (c === "needs_reauth") return t("sync.err.reauth", v);
    if (c === "server_not_connected") return t("sync.err.notConnected", v);
    if (c === "selection_required") return t("sync.err.selection", v);
    if (c === "blocked_by_policy" || c === "approval_required") return t("sync.err.policy", v);
    if (c === "server_unavailable") {
      // for a write this is ambiguous: the file may or may not exist now
      return isWrite ? t("sync.err.writeUnknown") : t("sync.err.unavailable", v);
    }
    if (c === "tool_error") {
      v.m = clip(String(err.message || ""), 120);
      return t("sync.err.tool", v);
    }
    return t("sync.err.other", v);
  }

  function driveNewest() {
    return window.claude.mcp.callTool(DRIVE, "search_files", {
      query: "title contains '" + SYNC_PREFIX + "' and mimeType = 'application/json'",
      pageSize: 25,
      excludeContentSnippets: true
    }, { cache: false }).then(function (res) {
      // an empty search resolves to {} rather than {files: []}
      var files = (res && res.payload && res.payload.files) || [];
      if (!files.length) return null;
      return files.slice().sort(function (a, b) {
        return String(b.createdTime || "").localeCompare(String(a.createdTime || ""));
      })[0];
    });
  }

  function driveLoad(file) {
    return window.claude.mcp.callTool(DRIVE, "download_file_content", {
      fileId: file.id
    }, { cache: false }).then(function (res) {
      var b64 = res && res.payload && res.payload.content;
      if (!b64) return null;
      var raw;
      try { raw = JSON.parse(b64decode(b64)); } catch (e) { return null; }
      var clean = sanitize(raw);
      if (!clean) return null;
      return {
        state: clean,
        savedAt: typeof raw.savedAt === "number"
          ? raw.savedAt
          : (Date.parse(file.createdTime) || 0)
      };
    });
  }

  function applyRemote(loaded) {
    state = loaded.state;
    state.syncedAt = loaded.savedAt;
    state.touchedAt = loaded.savedAt;
    state.seenDriveAt = loaded.savedAt;
    sync.driveAt = loaded.savedAt;
    view.filter = "all";
    save();
    render();
    renderSync();
    toast(t("sync.pulled", {
      n: state.boards.reduce(function (n, bd) { return n + Object.keys(bd.cards).length; }, 0)
    }));
  }

  function askSyncConflict(loaded) {
    var countAll = function (st) {
      return st.boards.reduce(function (n, bd) { return n + Object.keys(bd.cards).length; }, 0);
    };
    var dn = countAll(loaded.state);
    var ln = countAll(state);
    $("sheet").innerHTML =
      '<h2 id="sheetTitle">' + esc(t("sync.conflict.title")) + '</h2>' +
      '<p class="sub"></p>' +
      '<p style="margin:0;color:var(--ink-2);font-size:14px;">' +
        esc(t("sync.conflict.body", {
          dn: dn, ln: ln,
          dd: localeDate(loaded.savedAt, { day: "numeric", month: "short" }) + " " + localeTime(loaded.savedAt)
        })) + '</p>' +
      '<div class="sheet-foot"><span class="spacer"></span>' +
        '<button class="btn" type="button" id="syncKeepLocal">' +
          esc(t("sync.conflict.keepLocal")) + '</button>' +
        '<button class="btn btn-primary" type="button" id="syncUseDrive">' +
          esc(t("sync.conflict.useDrive")) + '</button>' +
      '</div>';
    $("backdrop").hidden = false;
    $("syncUseDrive").onclick = function () { closeSheet(); applyRemote(loaded); };
    $("syncKeepLocal").onclick = function () {
      closeSheet();
      // remember this Drive version so the same copy stops re-asking
      state.seenDriveAt = loaded.savedAt;
      sync.driveAt = loaded.savedAt;
      save();
      renderSync();
    };
    window.setTimeout(function () { $("syncKeepLocal").focus(); }, 20);
  }

  function drivePull(manual) {
    if (!mcpReady() || sync.off || sync.busy) return;
    sync.busy = true;
    sync.err = "";
    renderSync();

    driveNewest().then(function (file) {
      if (!file) {
        sync.busy = false; sync.checked = true; renderSync();
        if (manual) toast(t("sync.none"));
        return;
      }
      return driveLoad(file).then(function (loaded) {
        sync.busy = false;
        sync.checked = true;
        if (!loaded) {
          sync.err = t("sync.err.badFile");
          renderSync();
          return;
        }
        sync.driveAt = loaded.savedAt;
        var known = Math.max(state.syncedAt || 0, state.seenDriveAt || 0);
        if (loaded.savedAt <= known) {
          renderSync();
          if (manual) toast(t("sync.upToDate"));
          return;
        }
        /* With auto-sync on, always merge. "Untouched since my last push"
           is not proof this device has nothing the remote lacks: the
           push-on-hide stamps syncedAt, so a copy pushed later from
           another device would otherwise replace local work wholesale.
           Merging is safe either way — a clean device simply ends up with
           the remote contents. */
        if (view.autoSync) applyMerge(loaded);
        else if ((state.touchedAt || 0) <= (state.syncedAt || 0)) applyRemote(loaded);
        else askSyncConflict(loaded);
      });
    }).catch(function (err) {
      sync.busy = false;
      sync.checked = true;
      if (syncDead(err)) sync.off = true;
      else sync.err = syncErrText(err, false);
      renderSync();
      if (manual && sync.err) toast(sync.err);
    });
  }

  var pushTimer = 0;
  var AUTO_PUSH_MS = 120000;

  function scheduleAutoPush() {
    if (!view.autoSync || !mcpReady() || sync.off) return;
    window.clearTimeout(pushTimer);
    pushTimer = window.setTimeout(function () { drivePush(true); }, AUTO_PUSH_MS);
  }

  /* Card-level merge. Whole-board win/lose loses whatever the other side
     did; this keeps both, letting the newer edit of each card win and
     honouring tombstones so a delete is never undone by a merge. */
  function mergeStates(local, remote) {
    var tomb = {};
    [local.deleted || {}, remote.deleted || {}].forEach(function (d) {
      Object.keys(d).forEach(function (id) {
        tomb[id] = Math.max(tomb[id] || 0, d[id] || 0);
      });
    });
    var alive = function (card) {
      var ts = tomb[card.id];
      return !ts || (card.editedAt || 0) > ts;
    };

    var byId = {};
    local.boards.forEach(function (bd) { byId[bd.id] = { local: bd, remote: null }; });
    remote.boards.forEach(function (bd) {
      if (byId[bd.id]) byId[bd.id].remote = bd;
      else byId[bd.id] = { local: null, remote: bd };
    });

    var boards = [];
    // local order first, then boards that only exist remotely
    var order = local.boards.map(function (b) { return b.id; })
      .concat(remote.boards.filter(function (b) { return !byId[b.id].local; })
        .map(function (b) { return b.id; }));

    order.forEach(function (id) {
      var pair = byId[id];
      if (!pair) return;
      if (!pair.remote) { boards.push(pair.local); return; }
      if (!pair.local) { boards.push(pair.remote); return; }

      var cards = {};
      [pair.remote, pair.local].forEach(function (side) {
        Object.keys(side.cards).forEach(function (cid) {
          var c = side.cards[cid];
          if (!alive(c)) return;
          var have = cards[cid];
          if (!have || (c.editedAt || 0) > (have.editedAt || 0)) cards[cid] = c;
        });
      });

      // column set: local order, plus columns only the remote has
      var cols = [];
      var seenCol = {};
      pair.local.columns.forEach(function (col) { seenCol[col.id] = col; cols.push(col.id); });
      pair.remote.columns.forEach(function (col) {
        if (!seenCol[col.id]) { seenCol[col.id] = col; cols.push(col.id); }
      });

      var placed = {};
      var columns = cols.map(function (colId) {
        var lc = pair.local.columns.filter(function (c) { return c.id === colId; })[0];
        var rc = pair.remote.columns.filter(function (c) { return c.id === colId; })[0];
        var base = lc || rc;
        var ids = [];
        (rc ? rc.cards : []).concat(lc ? lc.cards : []).forEach(function (cid) {
          if (cards[cid] && !placed[cid]) { placed[cid] = 1; ids.push(cid); }
        });
        return { id: base.id, title: base.title, done: !!base.done, cards: ids };
      });

      // anything the merge kept but no column claimed lands in the first one
      Object.keys(cards).forEach(function (cid) {
        if (!placed[cid]) { placed[cid] = 1; columns[0].cards.push(cid); }
      });

      boards.push({
        id: pair.local.id, title: pair.local.title,
        columns: columns, cards: cards, created: pair.local.created
      });
    });

    return {
      v: 3, boards: boards,
      activeBoard: boards.some(function (b) { return b.id === local.activeBoard; })
        ? local.activeBoard : boards[0].id,
      syncedAt: local.syncedAt, touchedAt: local.touchedAt,
      seenDriveAt: local.seenDriveAt, deleted: tomb
    };
  }

  function applyMerge(loaded) {
    var merged = mergeStates(state, loaded.state);
    state = merged;
    state.syncedAt = loaded.savedAt;
    state.touchedAt = Date.now();
    state.seenDriveAt = loaded.savedAt;
    sync.driveAt = loaded.savedAt;
    save();
    render();
    renderSync();
    toast(t("sync.merged", {
      n: state.boards.reduce(function (n, bd) { return n + Object.keys(bd.cards).length; }, 0)
    }));
    scheduleAutoPush();
  }

  function drivePush() {
    if (!mcpReady() || sync.off || sync.busy) return;
    sync.busy = true;
    sync.err = "";
    renderSync();

    var now = new Date();
    var name = SYNC_PREFIX + isoOf(now) + "-" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") + ".json";
    var savedAt = Date.now();

    window.claude.mcp.callTool(DRIVE, "create_file", {
      title: name,
      textContent: JSON.stringify({
        v: 3, savedAt: savedAt, boards: state.boards, activeBoard: state.activeBoard
      }),
      contentMimeType: "application/json",
      disableConversionToGoogleType: true
    }).then(function () {
      state.syncedAt = savedAt;
      state.seenDriveAt = savedAt;
      sync.driveAt = savedAt;
      sync.busy = false;
      save();
      renderSync();
      toast(t("sync.pushed"));
    }).catch(function (err) {
      sync.busy = false;
      if (syncDead(err)) sync.off = true;
      else sync.err = syncErrText(err, true);
      renderSync();
      if (sync.err) toast(sync.err);
    });
  }

  function syncBoxHtml() {
    if (!mcpReady() || sync.off) {
      return '<div class="sync-box"><p class="sync-state is-off">' +
        '<span class="dot"></span><span>' + esc(t("sync.off")) + '</span></p></div>';
    }

    var dirty = (state.touchedAt || 0) > (state.syncedAt || 0);
    var line;
    if (sync.busy) line = t("sync.checking");
    else if (!state.syncedAt) line = t("sync.never");
    else {
      line = t("sync.last", {
        d: localeDate(state.syncedAt, { day: "numeric", month: "short" }) + " " + localeTime(state.syncedAt)
      });
      if (dirty) line += " · " + t("sync.dirty");
    }

    return '<div class="sync-box">' +
      '<p class="sync-state' + (dirty ? " is-stale" : "") + '">' +
        '<span class="dot"></span><span>' + esc(line) + '</span></p>' +
      (sync.err ? '<p class="sync-err">' + esc(sync.err) + '</p>' : '') +
      '<div class="sync-row">' +
        '<button class="btn btn-primary" type="button" id="syncPush"' +
          (sync.busy ? " disabled" : "") + '>' +
          esc(sync.busy ? t("sync.pushing") : t("sync.push")) + '</button>' +
        '<button class="btn" type="button" id="syncPull"' +
          (sync.busy ? " disabled" : "") + '>' + esc(t("sync.pull")) + '</button>' +
      '</div>' +
      '<p class="sync-note">' + esc(t("sync.autoNote")) + '</p>' +
      '<p class="sync-note">' + esc(t("sync.note")) + '</p>' +
      '</div>';
  }

  function renderSync() {
    var btn = $("btnPush");
    if (btn) {
      var show = mcpReady() && !sync.off;
      btn.hidden = !show;
      btn.disabled = sync.busy;
      btn.textContent = sync.busy ? t("sync.pushing") : t("sync.push");
    }
    var box = $("syncBox");
    if (box) box.innerHTML = syncBoxHtml();
  }

  /* ═══ Google Calendar (read-only) ═══════════════════════════ */
  var CAL = "Google Calendar";
  var GMAIL = "Gmail";
  var cal = { state: "idle", events: [], err: "", off: false };
  var mail = { state: "idle", threads: [], err: "", off: false };

  function calFetch(force) {
    if (!mcpReady() || cal.off) return;
    if (cal.state === "loading") return;
    if (cal.state === "done" && !force) { renderCalBody(); return; }

    cal.state = "loading";
    cal.err = "";
    renderCalBody();

    var from = new Date(); from.setHours(0, 0, 0, 0);
    var to = new Date(from.getTime() + view.calDays * 86400000);

    window.claude.mcp.callTool(CAL, "list_events", {
      startTime: from.toISOString(),
      endTime: to.toISOString(),
      orderBy: "startTime",
      pageSize: 100
    }, { cache: { staleTime: 60000 } }).then(function (res) {
      // an empty range comes back as calendar metadata with no `events` key
      var events = (res && res.payload && res.payload.events) || [];
      cal.events = events.filter(function (e) { return e && e.status !== "cancelled"; });
      cal.state = "done";
      renderCalBody();
    }).catch(function (err) {
      cal.state = "done";
      if (syncDead(err) || err.code === "server_not_connected") cal.off = true;
      else cal.err = syncErrText(err, false, CAL);
      renderCalBody();
    });
  }

  /* Events carry either start.dateTime (timed) or start.date (all-day). */
  function eventDay(ev) {
    var st = ev.start || {};
    if (st.date) return st.date;
    if (st.dateTime) return isoOf(new Date(st.dateTime));
    return "";
  }
  function eventTime(ev) {
    var st = ev.start || {};
    if (!st.dateTime) return t("cal.allDay");
    return localeTime(new Date(st.dateTime).getTime());
  }

  function renderCal() {
    return '<section class="panel">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("cal.titleN", { n: view.calDays })) + '</h2>' +
        '<p class="sub" id="calSub">' + esc(t("cal.sub")) + '</p>' +
      '</div>' +
      '<div class="controls"><div class="control-group">' +
        '<span>' + esc(t("cal.range")) + '</span><div class="seg">' +
          CAL_RANGES.map(function (d) {
            return '<button type="button" data-caldays="' + d + '" aria-pressed="' +
              (view.calDays === d) + '">' + esc(t("cal.d" + d)) + '</button>';
          }).join("") +
        '</div></div></div>' +
      '<div id="calBody"></div></section>';
  }

  function renderCalBody() {
    var host = $("calBody");
    if (!host) return;

    var sub = $("calSub");
    if (sub) sub.textContent = (mcpReady() && !cal.off) ? t("cal.sub") : t("cal.subNoConn");

    var byDay = {};
    openMatching().forEach(function (c) {
      if (!c.due) return;
      (byDay[c.due] = byDay[c.due] || { tasks: [], events: [] }).tasks.push(c);
    });
    cal.events.forEach(function (ev) {
      var d = eventDay(ev);
      if (!d) return;
      (byDay[d] = byDay[d] || { tasks: [], events: [] }).events.push(ev);
    });

    var out = "";
    for (var i = 0; i < view.calDays; i++) {
      var iso = shiftIso(i);
      var p = iso.split("-").map(Number);
      var dow = new Date(p[0], p[1] - 1, p[2]).getDay();
      var bucket = byDay[iso] || { tasks: [], events: [] };

      var items = "";
      bucket.events.slice().sort(function (a, b) {
        return String(eventTime(a)).localeCompare(String(eventTime(b)));
      }).forEach(function (ev) {
        items += '<div class="cal-item is-event">' +
          '<span class="t">' + esc(eventTime(ev)) + '</span>' +
          '<span class="label">' + esc(ev.summary || "(no title)") + '</span>' +
          '<span class="kind">' + esc(t("cal.event")) + '</span></div>';
      });
      sortCards(bucket.tasks, "pri").forEach(function (c) {
        items += '<div class="cal-item is-task p-' + c.pri + '" data-card="' + c.id + '" ' +
          'tabindex="0" role="button">' +
          '<span class="label">' + esc(c.title) + '</span>' +
          (crossBoard() && c.__board ? '<span class="kind">' + esc(c.__board.title) + '</span>' : '') +
          '<span class="kind">' + esc(t("cal.task")) + '</span></div>';
      });

      var showMonth = i === 0 || p[2] === 1;
      out += '<div class="cal-day' + (i === 0 ? " is-today" : "") +
        (dow === 0 || dow === 6 ? " is-weekend" : "") + '">' +
        '<div class="cal-date"><span class="d">' + p[2] + '</span>' +
          '<span class="w">' + esc(i === 0 ? t("chart.today") : L().dow[dow]) + '</span>' +
          (showMonth ? '<span class="w">' + esc(L().month[p[1] - 1]) + '</span>' : '') +
          '</div>' +
        '<div class="cal-items">' +
          (items || '<p class="cal-none">' + esc(t("cal.none")) + '</p>') +
        '</div></div>';
    }

    var foot = "";
    if (!mcpReady() || cal.off) {
      foot = '<p class="panel-foot">' + esc(t("cal.connect")) + '</p>';
    } else if (cal.state === "loading") {
      foot = '<p class="panel-foot">' + esc(t("cal.loading")) + '</p>';
    } else if (cal.err) {
      foot = '<p class="sync-err" style="margin:10px 16px;">' + esc(cal.err) + '</p>';
    }

    host.innerHTML = foot + '<div class="rows">' + out + '</div>';
  }

  /* Put a task's due date on the real calendar, so it can nag from a
     phone instead of waiting for this page to be opened. */
  function calPush(cardId) {
    var card = B().cards[cardId];
    if (!card) return;
    if (!card.due) { toast(t("cal.pushNeedDue")); return; }
    if (!mcpReady() || cal.off) { toast(t("cal.pushOff")); return; }

    var btn = $("calPush");
    if (btn) { btn.disabled = true; btn.textContent = t("cal.pushing"); }

    var start = card.due + "T09:00:00";
    var end = card.due + "T09:30:00";

    window.claude.mcp.callTool(CAL, "create_event", {
      summary: card.title,
      startTime: start,
      endTime: end,
      description: card.note || "",
      availability: "AVAILABILITY_FREE",
      notificationLevel: "NONE"
    }).then(function (res) {
      var id = res && res.payload && res.payload.id;
      card.calEventId = typeof id === "string" ? id : "yes";
      save();
      render();
      if ($("calPush")) {
        $("calPush").disabled = true;
        $("calPush").textContent = t("cal.pushed");
      }
      cal.state = "idle";
      toast(t("cal.pushedToast", { t: clip(card.title, 26) }));
    }).catch(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = t("cal.push"); }
      if (syncDead(err)) { cal.off = true; return; }
      toast(syncErrText(err, true, CAL));
    });
  }

  /* ── keeping the calendar in step, automatically ─────────────
     A task with a due date owns one 09:00 event. Moving the date moves
     the event, closing or deleting the task removes it. Work is queued
     and spaced so a burst of edits never fires a burst of calls. */
  var calQueue = [];
  var calRunning = false;

  function calSyncCard(card) {
    if (!view.autoCal || !mcpReady() || cal.off) return;
    var col = homeColumn(card);
    var closed = col && col.done;

    if (card.due && !closed) {
      if (!card.calEventId) calQueue.push({ op: "add", id: card.id });
      else if (card.calDue !== card.due || card.calTitle !== card.title) {
        calQueue.push({ op: "update", id: card.id });
      }
    } else if (card.calEventId) {
      calQueue.push({ op: "remove", id: card.id, eventId: card.calEventId });
      card.calEventId = "";
      card.calDue = "";
    }
    runCalQueue();
  }

  function calSyncAll() {
    if (!view.autoCal || !mcpReady() || cal.off) return;
    state.boards.forEach(function (bd) {
      Object.keys(bd.cards).forEach(function (id) {
        calSyncCard(tagBoard(bd.cards[id], bd));
      });
    });
  }

  function runCalQueue() {
    if (calRunning || !calQueue.length) return;
    calRunning = true;
    var job = calQueue.shift();
    var card = null;
    state.boards.forEach(function (bd) { if (bd.cards[job.id]) card = bd.cards[job.id]; });

    var done = function () {
      calRunning = false;
      save();
      if (calQueue.length) window.setTimeout(runCalQueue, 350);
    };

    if (job.op === "remove") {
      window.claude.mcp.callTool(CAL, "delete_event", {
        eventId: job.eventId, notificationLevel: "NONE"
      }).then(done, function (err) {
        if (syncDead(err)) cal.off = true;
        done();
      });
      return;
    }
    if (!card || !card.due) { done(); return; }

    var input = {
      summary: card.title,
      startTime: card.due + "T09:00:00",
      endTime: card.due + "T09:30:00",
      notificationLevel: "NONE"
    };
    if (job.op === "add") {
      input.description = card.note || "";
      input.availability = "AVAILABILITY_FREE";
    } else {
      input.eventId = card.calEventId;
    }

    window.claude.mcp.callTool(CAL, job.op === "add" ? "create_event" : "update_event", input)
      .then(function (res) {
        var id = res && res.payload && res.payload.id;
        if (typeof id === "string") card.calEventId = id;
        card.calDue = card.due;
        card.calTitle = card.title;
        done();
      }, function (err) {
        if (syncDead(err)) cal.off = true;
        done();
      });
  }

  /* ═══ Gmail (read-only) ═════════════════════════════════════ */
  /* One entry per readable mail connector. Only sources whose request
     and response shapes have actually been observed belong here. */
  var MAIL_SOURCES = [{
    server: GMAIL,
    tool: "search_threads",
    input: { query: "in:inbox newer_than:1d", pageSize: 10, view: "THREAD_VIEW_MINIMAL" },
    parse: function (payload) {
      return (payload.threads || []).map(function (th) {
        var m = (th.messages || [])[0] || {};
        return {
          id: th.id, source: GMAIL,
          from: m.sender || "", subject: m.subject || "",
          at: Date.parse(m.date) || 0,
          unread: (m.labelIds || []).indexOf("UNREAD") !== -1
        };
      });
    }
  }];

  function mailFetch(force) {
    if (!mcpReady() || mail.off) return;
    if (mail.state === "loading") return;
    if (mail.state === "done" && !force) { renderMailBody(); return; }

    mail.state = "loading";
    mail.err = "";
    renderMailBody();

    // each source is fetched independently so one failing never blanks the rest
    var results = [];
    var errs = [];
    var left = MAIL_SOURCES.length;

    MAIL_SOURCES.forEach(function (src) {
      window.claude.mcp.callTool(src.server, src.tool, src.input, {
        cache: { staleTime: 60000 }
      }).then(function (res) {
        try { results = results.concat(src.parse((res && res.payload) || {})); }
        catch (e) { errs.push({ server: src.server, err: { code: "tool_error", message: String(e) } }); }
      }).catch(function (err) {
        errs.push({ server: src.server, err: err });
      }).then(function () {
        left--;
        if (left) return;
        mail.threads = results.sort(function (a, b) { return b.at - a.at; });
        mail.state = "done";
        // only give up on the panel when every source is unusable
        var dead = errs.filter(function (e) {
          return syncDead(e.err) || e.err.code === "server_not_connected";
        });
        if (dead.length === MAIL_SOURCES.length) mail.off = true;
        else if (errs.length) mail.err = syncErrText(errs[0].err, false, errs[0].server);
        renderMailBody();
      });
    });
  }

  /* "Adidas <adidas@th-news.adidas.com>" → "Adidas" */
  function senderName(raw) {
    var m = /^\s*"?([^"<]+?)"?\s*</.exec(raw);
    if (m) return m[1].trim();
    var at = raw.indexOf("@");
    return at > 0 ? raw.slice(0, at) : raw;
  }

  function mailPanelHtml() {
    var unread = mail.threads.filter(function (x) { return x.unread; }).length;
    var body;

    if (mail.state === "loading") {
      body = '<p class="panel-empty">' + esc(t("mail.loading")) + '</p>';
    } else if (mail.err) {
      body = '<p class="sync-err" style="margin:12px 16px;">' + esc(mail.err) + '</p>';
    } else if (!mail.threads.length) {
      body = '<p class="panel-empty">' + esc(t("mail.none")) + '</p>';
    } else {
      body = '<div class="rows">' + mail.threads.map(function (x) {
        return '<div class="mail-row' + (x.unread ? " is-unread" : "") + '">' +
          '<span class="unread' + (x.unread ? "" : " read") + '"></span>' +
          '<div class="mail-main">' +
            '<div class="mail-from">' + esc(senderName(x.from)) + '</div>' +
            '<p class="mail-subject">' + esc(x.subject) + '</p>' +
          '</div>' +
          '<span class="mail-time">' + esc(x.at ? localeTime(x.at) : "") + '</span>' +
          '</div>';
      }).join("") + '</div>' +
      '<p class="panel-foot"><a href="https://mail.google.com/" target="_blank" rel="noreferrer noopener">' +
        esc(t("mail.open")) + ' →</a>' +
        (MAIL_SOURCES.length === 1 ? '<br /><span style="color:var(--muted)">' +
          esc(t("mail.onlyGmail")) + '</span>' : '') + '</p>';
    }

    return '<section class="panel" id="mailPanel">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("mail.title")) + '</h2>' +
        '<p class="sub">' + esc(t("mail.sub")) + '</p>' +
        (unread ? '<span class="n">' + t("mail.unreadN", { n: unread }) + '</span>' : '') +
      '</div>' + body + '</section>';
  }

  function renderMailBody() {
    var host = $("mailPanel");
    if (!host || !host.parentNode) return;
    if (mail.off) { host.parentNode.removeChild(host); return; }
    var holder = document.createElement("div");
    holder.innerHTML = mailPanelHtml();
    host.parentNode.replaceChild(holder.firstChild, host);
  }

  /* ═══ render: pulse strip ═══════════════════════════════════ */
  function renderPulse() {
    var cards = scopedOpenCards();
    var over = 0, today = 0, week = 0;
    cards.forEach(function (c) {
      var n = daysUntil(c.due);
      if (n === null) return;
      if (n < 0) over++;
      else if (n === 0) today++;
      if (n >= 0 && n <= 7) week++;
    });

    var tiles = [
      { k: "overdue", cls: "t-over", n: over, lbl: t("tile.overdue") },
      { k: "today", cls: "t-today", n: today, lbl: t("tile.today") },
      { k: "week", cls: "t-week", n: week, lbl: t("tile.week") },
      { k: "all", cls: "t-open", n: cards.length, lbl: t("tile.open") }
    ];

    $("pulse").innerHTML = tiles.map(function (x) {
      var on = view.filter === x.k;
      return '<button type="button" class="tile ' + x.cls + '" data-filter="' + x.k +
        '" aria-pressed="' + on + '">' +
        '<span class="n' + (x.n === 0 ? " zero" : "") + '">' + x.n + '</span>' +
        '<span class="lbl">' + esc(x.lbl) + '</span></button>';
    }).join("");

    var doneToday = 0;
    var start = new Date(); start.setHours(0, 0, 0, 0);
    var scan = crossBoard() ? state.boards : [B()];
    scan.forEach(function (bd) {
      Object.keys(bd.cards).forEach(function (id) {
        if (bd.cards[id].doneAt >= start.getTime()) doneToday++;
      });
    });

    var tail = doneToday ? t("note.tail", { n: doneToday }) : "";
    var hue = "var(--ok)";
    var text;
    if (over > 0) {
      hue = "var(--danger)";
      text = t("note.over", { n: over }) + tail;
    } else if (today > 0) {
      hue = "var(--warn)";
      text = t("note.today", { n: today }) + tail;
    } else {
      text = t("note.clear") + tail;
    }
    $("pulseNote").innerHTML =
      '<span class="dot" style="background:' + hue + '"></span><span>' + esc(text) + '</span>';
  }

  /* ═══ render: card ══════════════════════════════════════════ */
  function priLabel(p) { return t("pri." + p); }

  var ICON_LOG = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" ' +
    'stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="1.4" y="2.1" width="9.2" height="6.1" rx="1.7" />' +
    '<path d="M4.2 8.2v2.3l2.5-2.3" /></svg>';

  function logChip(card) {
    var n = logOf(card).length;
    if (!n) return "";
    return '<span class="chip log-count' + (n >= 3 ? " hot" : "") + '" ' +
      'title="' + esc(t("log.count", { n: n })) + '">' + ICON_LOG + n + '</span>';
  }

  function cardHtml(card, col, ci) {
    var chips = "";
    if (card.due) {
      var d = dueLabel(card.due);
      chips += '<span class="chip due ' + d.cls + '">' + esc(d.text) + '</span>';
    }
    if (card.pri !== "low" && !col.done) {
      chips += '<span class="chip">' + esc(priLabel(card.pri)) + '</span>';
    }
    chips += logChip(card);
    if ((card.checks || []).length) {
      var kd = card.checks.filter(function (k) { return k.done; }).length;
      chips += '<span class="chip checks' + (kd === card.checks.length ? " all-done" : "") + '">' +
        kd + '/' + card.checks.length + '</span>';
    }
    if ((card.files || []).length) {
      chips += '<span class="chip files">' + card.files.length + '</span>';
    }
    if (card.repeat) chips += '<span class="chip repeat">' + esc(t("repeat.chip", { t: t("repeat." + card.repeat) })) + '</span>';
    var sd = staleDays(card);
    if (sd >= STALE_DAYS) chips += '<span class="chip stale">' + esc(t("stale.chip", { n: sd })) + '</span>';
    card.tags.forEach(function (x) {
      chips += '<span class="chip tag">' + esc(x) + '</span>';
    });
    if (card.note && !chips) {
      chips += '<span class="chip note-flag" title="' + esc(t("card.noteFlag")) + '">···</span>';
    }

    var atFirst = ci === 0;
    var atLast = ci === B().columns.length - 1;

    return '<article class="card p-' + card.pri + (col.done ? " is-done" : "") +
      '" draggable="true" data-card="' + card.id + '" tabindex="0" ' +
      'aria-label="' + esc(t("card.aria", { t: card.title })) + '">' +
      '<p class="card-title">' + esc(card.title) + '</p>' +
      (card.note ? '<p class="card-note">' + esc(card.note) + '</p>' : '') +
      '<div class="card-meta">' + chips + '</div>' +
      '<div class="card-move">' +
        '<button type="button" data-nudge="-1" data-card="' + card.id + '"' +
          (atFirst ? " disabled" : "") + ' aria-label="' + esc(t("card.left")) + '">←</button>' +
        '<button type="button" data-nudge="1" data-card="' + card.id + '"' +
          (atLast ? " disabled" : "") + ' aria-label="' + esc(t("card.right")) + '">→</button>' +
      '</div></article>';
  }

  /* ═══ render: shared task row ═══════════════════════════════ */
  function rowHtml(card, opts) {
    opts = opts || {};
    var col = homeColumn(card);
    var isDone = col && col.done;

    var meta = '<span class="pri-dot p-' + card.pri + '" title="' +
      esc(t("pri.aria", { t: priLabel(card.pri) })) + '"></span>';
    if (opts.showColumn !== false && col) meta += '<span>' + esc(col.title) + '</span>';
    if (card.note) meta += '<span>· ' + esc(clip(card.note.split("\n")[0], 55)) + '</span>';
    meta += logChip(card);
    if (crossBoard() && card.__board) {
      meta += '<span class="chip from-board">' + esc(card.__board.title) + '</span>';
    }
    if (card.repeat) meta += '<span class="chip repeat">' + esc(t("repeat.chip", { t: t("repeat." + card.repeat) })) + '</span>';
    var sdr = staleDays(card);
    if (sdr >= STALE_DAYS) meta += '<span class="chip stale">' + esc(t("stale.chip", { n: sdr })) + '</span>';
    card.tags.forEach(function (x) { meta += '<span class="chip tag">' + esc(x) + '</span>'; });

    var when = "";
    if (card.due) {
      var d = dueLabel(card.due);
      when = '<span class="chip due ' + d.cls + '">' + esc(d.text) + '</span>' +
        (opts.showExact === false ? "" : '<span class="exact">' + esc(exactDate(card.due)) + '</span>');
    } else if (opts.showExact !== false) {
      when = '<span class="exact">' + esc(t("dueL.none")) + '</span>';
    }

    return '<div class="row' + (isDone ? " done-row" : "") + '" data-card="' + card.id + '" ' +
      'tabindex="0" aria-label="' + esc(card.title) + '">' +
      '<button class="tick" type="button" data-complete="' + card.id + '" ' +
        'aria-label="' + esc(isDone ? t("row.reopen") : t("row.complete")) + '">✓</button>' +
      '<div class="row-main">' +
        '<p class="row-title">' + esc(card.title) + '</p>' +
        '<div class="row-meta">' + meta + '</div>' +
      '</div>' +
      (when ? '<div class="row-when">' + when + '</div>' : '') +
      '</div>';
  }

  function panelHtml(opts) {
    var body = opts.cards && opts.cards.length
      ? '<div class="rows">' + opts.cards.map(function (c) {
          return rowHtml(c, opts.rowOpts);
        }).join("") + '</div>'
      : '<p class="panel-empty">' + esc(opts.empty || t("panel.empty")) + '</p>';

    return '<section class="panel' + (opts.sev ? " sev-" + opts.sev : "") + '">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(opts.title) + '</h2>' +
        (opts.sub ? '<p class="sub">' + esc(opts.sub) + '</p>' : '') +
        '<span class="n">' + t("panel.count", { n: opts.cards ? opts.cards.length : 0 }) + '</span>' +
      '</div>' + (opts.extra || "") + body + '</section>';
  }

  /* ═══ selectors used by the summary pages ═══════════════════ */
  var PRI_ORDER = { high: 0, mid: 1, low: 2 };

  /* Summary views can span every board — the point of the scope switch is
     that a forgetful person shouldn't have to open each project to find
     out what is due today. The board view itself is always single-board. */
  function scopedOpenCards() {
    if (view.scope === "all" && state.boards.length > 1) return everyBoardOpenCards();
    return openCards();
  }
  function openMatching() { return scopedOpenCards().filter(matches); }

  function crossBoard() { return view.scope === "all" && state.boards.length > 1; }

  function scopeBarHtml() {
    if (state.boards.length < 2) return "";
    return '<div class="controls"><div class="control-group">' +
      '<span>' + esc(t("scope.label")) + '</span><div class="seg">' +
        '<button type="button" data-scope="all" aria-pressed="' + (view.scope === "all") + '">' +
          esc(t("scope.all")) + '</button>' +
        '<button type="button" data-scope="one" aria-pressed="' + (view.scope === "one") + '">' +
          esc(t("scope.one")) + '</button>' +
      '</div></div></div>';
  }

  function byBucket(cards, test) {
    return cards.filter(function (c) { return test(daysUntil(c.due), c); });
  }

  function dueRank(c) {
    var n = daysUntil(c.due);
    return n === null ? 1e6 : n;
  }

  function sortCards(list, mode) {
    var out = list.slice();
    if (mode === "pri") {
      out.sort(function (a, b) {
        var d = PRI_ORDER[a.pri] - PRI_ORDER[b.pri];
        return d ? d : dueRank(a) - dueRank(b);
      });
    } else if (mode === "new") {
      out.sort(function (a, b) { return b.created - a.created; });
    } else {
      out.sort(function (a, b) {
        var d = dueRank(a) - dueRank(b);
        return d ? d : PRI_ORDER[a.pri] - PRI_ORDER[b.pri];
      });
    }
    return out;
  }

  /* ═══ page: today ═══════════════════════════════════════════ */
  function renderToday() {
    var cards = openMatching();
    var overdue = sortCards(byBucket(cards, function (n) { return n !== null && n < 0; }), "due");
    var today = sortCards(byBucket(cards, function (n) { return n === 0; }), "pri");
    var tomorrow = sortCards(byBucket(cards, function (n) { return n === 1; }), "pri");
    var rotting = sortCards(cards.filter(function (c) {
      return !c.due && c.pri !== "low";
    }), "pri");

    var start = new Date(); start.setHours(0, 0, 0, 0);
    var closed = [];
    (crossBoard() ? state.boards : [B()]).forEach(function (bd) {
      Object.keys(bd.cards).forEach(function (id) {
        var c = bd.cards[id];
        if (c.doneAt >= start.getTime()) closed.push(tagBoard(c, bd));
      });
    });
    closed.sort(function (a, b) { return b.doneAt - a.doneAt; });

    var html = "";

    if (overdue.length) {
      html += panelHtml({
        sev: "over", title: t("today.overdue.title"), sub: t("today.overdue.sub"),
        cards: overdue
      });
    }

    html += panelHtml({
      sev: "today", title: t("today.due.title"),
      sub: localeDate(Date.now(), { weekday: "long", day: "numeric", month: "long" }),
      cards: today,
      empty: overdue.length ? t("today.due.emptyA") : t("today.due.emptyB")
    });

    if (tomorrow.length) {
      html += panelHtml({
        sev: "next", title: t("today.tomorrow.title"), sub: t("today.tomorrow.sub"),
        cards: tomorrow
      });
    }

    if (rotting.length) {
      html += panelHtml({
        title: t("today.rot.title"), sub: t("today.rot.sub"),
        cards: rotting, rowOpts: { showExact: false }
      });
    }

    var stale = openMatching().filter(function (c) { return staleDays(c) >= STALE_DAYS; })
      .sort(function (a, b) { return staleDays(b) - staleDays(a); });
    if (stale.length) {
      html += panelHtml({
        title: t("stale.title"), sub: t("stale.sub", { n: STALE_DAYS }),
        cards: stale, rowOpts: { showExact: false }
      });
    }

    if (mcpReady() && !mail.off) html += mailPanelHtml();

    html += panelHtml({
      sev: "done", title: t("today.closed.title"), cards: closed,
      empty: t("today.closed.empty"), rowOpts: { showExact: false }
    });

    return html;
  }

  /* ═══ page: remaining ═══════════════════════════════════════ */
  function renderRemain() {
    var cards = openMatching();

    var groups = [];
    if (view.groupBy === "col") {
      var order = [];
      var byCol = {};
      cards.forEach(function (c) {
        var col = homeColumn(c);
        var key = col ? col.title : t("col.empty");
        if (!byCol[key]) { byCol[key] = []; order.push(key); }
        byCol[key].push(c);
      });
      order.forEach(function (key) { groups.push({ label: key, cards: byCol[key] }); });
    } else if (view.groupBy === "pri") {
      ["high", "mid", "low"].forEach(function (p) {
        var inPri = cards.filter(function (c) { return c.pri === p; });
        if (inPri.length) groups.push({ label: priLabel(p), cards: inPri });
      });
    } else {
      var byTag = {};
      var untagged = [];
      cards.forEach(function (c) {
        if (!c.tags.length) { untagged.push(c); return; }
        c.tags.forEach(function (x) { (byTag[x] = byTag[x] || []).push(c); });
      });
      Object.keys(byTag).sort().forEach(function (x) {
        groups.push({ label: x, cards: byTag[x] });
      });
      if (untagged.length) groups.push({ label: t("group.untagged"), cards: untagged });
    }

    var controls =
      '<div class="controls">' +
        '<div class="control-group"><span>' + esc(t("remain.groupLabel")) + '</span><div class="seg">' +
          seg("group", "col", t("group.col")) + seg("group", "pri", t("group.pri")) +
          seg("group", "tag", t("group.tag")) +
        '</div></div>' +
        '<div class="control-group"><span>' + esc(t("remain.sortLabel")) + '</span><div class="seg">' +
          seg("sort", "due", t("sort.due")) + seg("sort", "pri", t("sort.pri")) +
          seg("sort", "new", t("sort.new")) +
        '</div></div>' +
      '</div>';

    var body;
    if (!groups.length) {
      body = '<p class="panel-empty">' +
        esc(view.query || view.filter !== "all" ? t("remain.noMatch") : t("remain.none")) + '</p>';
    } else {
      body = '<div class="rows">' + groups.map(function (g) {
        return '<div class="group-head">' + esc(g.label) +
          '<span class="n">' + g.cards.length + '</span></div>' +
          sortCards(g.cards, view.sortBy).map(function (c) {
            return rowHtml(c, { showColumn: view.groupBy !== "col" });
          }).join("");
      }).join("") + '</div>';
    }

    return '<section class="panel">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("remain.title")) + '</h2>' +
        '<p class="sub">' + esc(t("remain.sub")) + '</p>' +
        '<span class="n">' + t("panel.count", { n: cards.length }) + '</span>' +
      '</div>' + controls + body + '</section>';
  }

  function seg(kind, value, label) {
    var on = (kind === "group" ? view.groupBy : view.sortBy) === value;
    return '<button type="button" data-' + kind + '="' + value + '" aria-pressed="' + on + '">' +
      esc(label) + '</button>';
  }

  /* ═══ page: due dates ═══════════════════════════════════════ */
  var DUE_BUCKETS = [
    { key: "over", when: "bucket.overWhen", test: function (n) { return n < 0; } },
    { key: "today", when: "", test: function (n) { return n === 0; } },
    { key: "tmr", when: "", test: function (n) { return n === 1; } },
    { key: "week", when: "", test: function (n) { return n >= 2 && n <= 7; } },
    { key: "month", when: "", test: function (n) { return n >= 8 && n <= 30; } },
    { key: "later", when: "", test: function (n) { return n > 30; } }
  ];

  function renderDue() {
    var cards = openMatching();
    var dated = cards.filter(function (c) { return c.due; });
    var undated = cards.filter(function (c) { return !c.due; });

    var body = "";
    DUE_BUCKETS.forEach(function (b) {
      var inB = sortCards(dated.filter(function (c) { return b.test(daysUntil(c.due)); }), "due");
      if (!inB.length) return;
      body += '<div class="group-head">' + esc(t("bucket." + b.key)) +
        (b.when ? '<span class="when">' + esc(t(b.when)) + '</span>' : "") +
        '<span class="n">' + inB.length + '</span></div>' +
        inB.map(function (c) { return rowHtml(c); }).join("");
    });

    if (undated.length) {
      body += '<div class="group-head">' + esc(t("bucket.undated")) +
        '<span class="when">' + esc(t("bucket.undatedWhen")) + '</span>' +
        '<span class="n">' + undated.length + '</span></div>' +
        sortCards(undated, "pri").map(function (c) {
          return rowHtml(c, { showExact: false });
        }).join("");
    }

    var list = body
      ? '<div class="rows">' + body + '</div>'
      : '<p class="panel-empty">' + esc(t("due.noMatch")) + '</p>';

    return loadStripHtml(dated) +
      '<section class="panel">' +

  /* 14-day load strip: one series (tasks due per day), single hue,
     today's column emphasized. The agenda list below is its table view. */
  var DAYS_AHEAD = 14;

  function loadStripHtml(dated) {
    var days = [];
    var max = 0;
    for (var i = 0; i < DAYS_AHEAD; i++) {
      var iso = shiftIso(i);
      var due = dated.filter(function (c) { return c.due === iso; });
      var p = iso.split("-").map(Number);
      var dow = new Date(p[0], p[1] - 1, p[2]).getDay();
      days.push({ iso: iso, day: p[2], dow: dow, cards: due });
      if (due.length > max) max = due.length;
    }

    if (!max) {
      return '<section class="panel"><div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("chart.title")) + '</h2></div>' +
        '<p class="panel-empty">' + esc(t("chart.empty")) + '</p></section>';
    }

    // Label only today and the busiest day — never a value on every bar.
    var peak = -1;
    days.forEach(function (d, i) { if (d.cards.length === max && peak === -1) peak = i; });

    var bars = days.map(function (d, i) {
      // 56px of plot leaves room for the cap label inside the 78px band
      var h = d.cards.length ? Math.max(6, Math.round(d.cards.length / max * 56)) : 0;
      var label = (i === 0 || i === peak) && d.cards.length
        ? '<span class="cap">' + d.cards.length + '</span>' : "";
      return '<button class="day' + (d.cards.length ? "" : " empty") +
        (i === 0 ? " is-today" : "") +
        (d.dow === 0 || d.dow === 6 ? " weekend" : "") +
        '" type="button" data-day="' + d.iso + '" ' +
        'aria-label="' + esc(t("chart.dayAria", { d: exactDate(d.iso), n: d.cards.length })) + '">' +
        label + '<span class="bar" style="height:' + h + 'px"></span></button>';
    }).join("");

    var axis = days.map(function (d, i) {
      return '<span class="tick-lbl' + (i === 0 ? " is-today" : "") + '">' + d.day +
        '<small>' + esc(i === 0 ? t("chart.today") : L().dow[d.dow]) + '</small></span>';
    }).join("");

    var sub = max === 1
      ? t("chart.spread")
      : t("chart.peak", { d: exactDate(days[peak].iso), n: max });

    return '<section class="panel panel-chart">' +
      '<div class="chart-wrap">' +
        '<div class="chart-caption"><strong>' + esc(t("chart.title")) + '</strong>' +
          '<span>' + esc(sub) + '</span></div>' +
        '<div class="plot" id="plot">' + bars + '<div class="tip" id="tip" hidden></div></div>' +
        '<div class="axis">' + axis + '</div>' +
      '</div></section>';
  }

  function runBoardAction(act) {
    view.boardMenu = false;
    var bd = B();
    render();

    if (act === "rename") {
      askText({
        title: t("board.rename"), label: t("board.name"), value: bd.title,
        ok: t("common.save"),
        onOk: function (name) { bd.title = name; commit(); }
      });
    } else if (act === "dup") {
      var copy = JSON.parse(JSON.stringify(bd));
      copy.id = uid("b");
      copy.title = bd.title + " " + t("board.copySuffix");
      copy.created = Date.now();
      // fresh ids so the two boards never share a card
      var map = {};
      var cards = {};
      Object.keys(copy.cards).forEach(function (old) {
        var nid = uid("k");
        map[old] = nid;
        copy.cards[old].id = nid;
        cards[nid] = copy.cards[old];
      });
      copy.cards = cards;
      copy.columns.forEach(function (col) {
        col.id = uid("c");
        col.cards = col.cards.map(function (x) { return map[x]; }).filter(Boolean);
      });
      state.boards.push(copy);
      state.activeBoard = copy.id;
      commit();
      toast(t("board.created", { t: copy.title }));
    } else if (act === "del") {
      if (state.boards.length === 1) { toast(t("board.needOne")); return; }
      var n = Object.keys(bd.cards).length;
      askConfirm({
        title: t("board.delTitle", { t: bd.title }),
        body: n ? t("board.delBody", { n: n }) : t("board.delBodyEmpty"),
        ok: t("board.del"), danger: true,
        onOk: function () {
          var i = boardIndex(bd.id);
          if (i === -1) return;
          state.boards.splice(i, 1);
          state.activeBoard = state.boards[Math.max(0, i - 1)].id;
          commit();
        }
      });
    }
  }

  /* Swatches preview the chosen hue at light-theme values — the real
     background re-derives its stops per theme in CSS. */
  function bgPreview(kind) {
    var h = view.hue;
    var a = "hsl(" + h + " 38% 96%)";
    var b = "hsl(" + ((h + 38) % 360) + " 46% 85%)";
    var c = "hsl(" + ((h + 326) % 360) + " 40% 90%)";
    if (kind === "solid") return a;
    if (kind === "linear") return "linear-gradient(155deg," + a + " 0%," + b + " 100%)";
    if (kind === "radial") return "radial-gradient(125% 95% at 12% -5%," + a + " 0%," + b + " 72%)";
    if (kind === "mesh") {
      return "radial-gradient(58% 52% at 10% 6%," + c + " 0%,transparent 62%)," +
        "radial-gradient(52% 48% at 90% 10%," + b + " 0%,transparent 64%)," +
        "radial-gradient(68% 58% at 48% 102%," + b + " 0%,transparent 66%)," + a;
    }
    return "var(--ground)";
  }

          '<button class="btn" type="button" id="calPush"' +
            (card.calEventId ? " disabled" : "") + '>' +
            esc(card.calEventId ? t("cal.pushed") : t("cal.push")) + '</button></div>' +
      '</div>' +
      '<div class="log" id="checkSection">' + checksHtml(card) + '</div>' +
      '<div class="log" id="fileSection">' + filesHtml(card) + '</div>' +
      '<div class="log" id="logSection">' + logSectionHtml(card) + '</div>' +
      '<div class="sheet-foot">' +
        '<button class="btn btn-danger" type="button" id="fDelete">' + esc(t("ed.delete")) + '</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn" type="button" id="fCancel">' + esc(t("common.cancel")) + '</button>' +
        '<button class="btn btn-primary" type="button" id="fSave">' + esc(t("common.save")) + '</button>' +
      '</div>';

    $("backdrop").hidden = false;
    var list = $("sheet").querySelector(".log-list");
    if (list) list.scrollTop = list.scrollHeight;
    window.setTimeout(function () { $("fTitle").focus(); }, 20);
  }

  function closeEditor() { closeSheet(); }

  function saveEditor() {
    if (!editing) return;
    var card = B().cards[editing.id];
    if (!card) { closeEditor(); return; }
    var title = $("fTitle").value.trim();
    if (!title) { $("fTitle").focus(); return; }
    card.title = title;
    card.note = $("fNote").value.trim();
    card.due = $("fDue").value || "";
    card.pri = editing.pri;
    var rep = $("fRepeat");
    if (rep) card.repeat = REPEATS.indexOf(rep.value) > 0 ? rep.value : "";
    card.tags = $("fTags").value.split(",")
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x; })
      .slice(0, 8);

    // an update typed but not yet added shouldn't be lost on save
    var pending = $("logInput");
    if (pending && pending.value.trim()) {
      logOf(card).push({ id: uid("g"), text: pending.value.trim(), at: Date.now() });
    }

    touchCard(card);
    var target = $("fCol").value;
    var here = colOf(card.id);
    closeEditor();
    calSyncCard(card);
    if (target !== here.id) {
      moveCard(card.id, target, B().columns[colIndex(target)].cards.length);
    } else {
      commit();
    }
  }

  /* ═══ drag & drop ═══════════════════════════════════════════ */
  var dragId = null;
  var dropLine = null;

  function clearDropLine() {
    if (dropLine && dropLine.parentNode) dropLine.parentNode.removeChild(dropLine);
    dropLine = null;
    Array.prototype.forEach.call(document.querySelectorAll(".col-body.drag-over"), function (el) {
      el.classList.remove("drag-over");
    });
  }

  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    dragId = card.dataset.card;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* older browsers */ }
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (card) card.classList.remove("dragging");
    dragId = null;
    clearDropLine();
  });

  document.addEventListener("dragover", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (!body || !dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";

    body.classList.add("drag-over");
    if (!dropLine) {
      dropLine = document.createElement("div");
      dropLine.className = "drop-line";
    }

    var cards = Array.prototype.filter.call(body.querySelectorAll(".card"), function (el) {
      return !el.classList.contains("dragging");
    });
    var after = null;
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { after = cards[i]; break; }
    }
    if (after) body.insertBefore(dropLine, after);
    else body.appendChild(dropLine);
  });

  document.addEventListener("dragleave", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (body && !body.contains(e.relatedTarget)) body.classList.remove("drag-over");
  });

  document.addEventListener("drop", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (!body || !dragId) return;
    e.preventDefault();

    var colId = body.dataset.drop;
    var anchorId = null;
    if (dropLine && dropLine.parentNode === body) {
      var el = dropLine.nextElementSibling;
      while (el && !(el.classList && el.classList.contains("card"))) el = el.nextElementSibling;
      if (el && el.dataset.card !== dragId) anchorId = el.dataset.card;
    }

    var moving = dragId;
    clearDropLine();
    dragId = null;
    dropBefore(moving, colId, anchorId);
  });

  /* ═══ events ════════════════════════════════════════════════ */
  document.addEventListener("click", function (e) {
    var target = e.target;
    var hit;

    // checklist
    hit = target.closest("[data-check]");
    if (hit && editing) { toggleCheck(editing.id, hit.dataset.check); return; }
    hit = target.closest("[data-check-del]");
    if (hit && editing) { delCheck(editing.id, hit.dataset.checkDel); return; }
    if (target.closest("#checkAdd") && editing) {
      var ci = $("checkInput");
      if (ci && ci.value.trim()) addCheck(editing.id, ci.value);
      return;
    }

    // attachments
    if (target.closest("#fileAdd")) { $("fileUp").click(); return; }
    hit = target.closest("[data-file-del]");
    if (hit && editing) { delFile(editing.id, hit.dataset.fileDel); return; }

    // auto toggles
    hit = target.closest("[data-autocal]");
    if (hit) {
      view.autoCal = hit.dataset.autocal === "1";
      saveUi();
      if (view.autoCal) calSyncAll();
      openSettings();
      return;
    }
    hit = target.closest("[data-autosync]");
    if (hit) {
      view.autoSync = hit.dataset.autosync === "1";
      saveUi();
      if (view.autoSync) scheduleAutoPush();
      openSettings();
      return;
    }

    // Drive sync
    if (target.closest("#btnPush") || target.closest("#syncPush")) { drivePush(); return; }
    if (target.closest("#syncPull")) { drivePull(true); return; }

    // settings
    if (target.closest("#btnSettings")) { openSettings(); return; }
    hit = target.closest("[data-lang]");
    if (hit) {
      view.lang = hit.dataset.lang;
      saveUi();
      applyStatic();
      render();
      openSettings();
      return;
    }
    hit = target.closest("[data-font-opt]");
    if (hit) {
      view.font = hit.dataset.fontOpt;
      saveUi();
      applyStatic();
      openSettings();
      return;
    }
    hit = target.closest("[data-bg-opt]");
    if (hit) {
      view.bg = hit.dataset.bgOpt;
      saveUi();
      applyStatic();
      openSettings();
      return;
    }

    // calendar task chip → the same editor
    hit = target.closest(".cal-item.is-task");
    if (hit) { focusCard(hit.dataset.card); return; }
    if (target.closest("#setClose")) { closeSheet(); return; }

    // board tabs
    hit = target.closest("[data-board]");
    if (hit) {
      state.activeBoard = hit.dataset.board;
      view.boardMenu = false;
      view.menuFor = null;
      view.composing = null;
      cal.state = "idle";
      save(); render();
      return;
    }
    if (target.closest("#boardAdd")) {
      askText({
        title: t("board.addTitle"), label: t("board.name"),
        placeholder: t("board.namePh"), ok: t("board.add"),
        onOk: function (name) {
          var fresh = seed();
          fresh.title = name;
          // a brand new board starts empty rather than with sample cards
          fresh.cards = {};
          fresh.columns.forEach(function (col) { col.cards = []; });
          state.boards.push(fresh);
          state.activeBoard = fresh.id;
          commit();
          toast(t("board.created", { t: name }));
        }
      });
      return;
    }
    if (target.closest("#boardMenu")) {
      view.boardMenu = !view.boardMenu;
      render();
      return;
    }
    hit = target.closest("[data-bact]");
    if (hit) { runBoardAction(hit.dataset.bact); return; }
    if (view.boardMenu && !target.closest("[data-menu-panel]")) { view.boardMenu = false; render(); }

    // scope + calendar range
    hit = target.closest("[data-scope]");
    if (hit) { view.scope = hit.dataset.scope; saveUi(); render(); return; }
    hit = target.closest("[data-caldays]");
    if (hit) {
      view.calDays = Number(hit.dataset.caldays);
      cal.state = "idle";
      saveUi(); render();
      return;
    }
    if (target.closest("#calPush")) {
      if (editing) calPush(editing.id);
      return;
    }

    // view tabs
    hit = target.closest("[data-page]");
    if (hit) {
      view.page = hit.dataset.page;
      view.menuFor = null;
      view.composing = null;
      saveUi();
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }

    // group / sort controls on the remaining page
    hit = target.closest("[data-group]");
    if (hit) { view.groupBy = hit.dataset.group; saveUi(); render(); return; }
    hit = target.closest("[data-sort]");
    if (hit) { view.sortBy = hit.dataset.sort; saveUi(); render(); return; }

    // activity log
    if (target.closest("#logAdd")) { submitLog(); return; }
    hit = target.closest("[data-log-del]");
    if (hit && editing) { deleteLogEntry(editing.id, hit.dataset.logDel); return; }

    // tick a task off from a summary row
    hit = target.closest("[data-complete]");
    if (hit) { completeCard(hit.dataset.complete); return; }

    // summary row → open the same editor the board uses
    hit = target.closest(".row[data-card]");
    if (hit) { focusCard(hit.dataset.card); return; }

    // pulse filters
    hit = target.closest("[data-filter]");
    if (hit) {
      var f = hit.dataset.filter;
      view.filter = (view.filter === f || f === "all") ? "all" : f;
      render();
      return;
    }

    if (target.closest("#clearFilter")) { view.filter = "all"; render(); return; }

    // column menu
    hit = target.closest("[data-menu]");
    if (hit) {
      view.menuFor = view.menuFor === hit.dataset.menu ? null : hit.dataset.menu;
      render();
      return;
    }

    hit = target.closest("[data-act]");
    if (hit) { runColAction(hit.dataset.act, hit.dataset.col); return; }

    if (view.menuFor && !target.closest("[data-menu-panel]")) { view.menuFor = null; render(); }

    // composer
    hit = target.closest("[data-add]");
    if (hit) { view.composing = hit.dataset.add; render(); return; }

    hit = target.closest("[data-compose-save]");
    if (hit) {
      var val = $("composerInput").value.trim();
      if (val) { addCard(hit.dataset.composeSave, val); view.composing = hit.dataset.composeSave; render(); }
      return;
    }

    if (target.closest("[data-compose-cancel]")) { view.composing = null; render(); return; }

    if (target.closest("#addCol")) {
      askText({
        title: t("addCol.title"),
        label: t("addCol.label"),
        placeholder: t("addCol.ph"),
        ok: t("addCol.title"),
        onOk: function (name) {
          B().columns.push({ id: uid("c"), title: name, done: false, cards: [] });
          commit();
        }
      });
      return;
    }

    // card nudge
    hit = target.closest("[data-nudge]");
    if (hit) { nudge(hit.dataset.card, Number(hit.dataset.nudge)); return; }

    // open card
    hit = target.closest(".card");
    if (hit) { openEditor(hit.dataset.card); return; }

    // editor controls
    hit = target.closest("[data-quick]");
    if (hit) {
      var q = hit.dataset.quick;
      $("fDue").value = q === "clear" ? "" : shiftIso(Number(q));
      return;
    }
    hit = target.closest("#fPri [data-v]");
    if (hit && editing) {
      editing.pri = hit.dataset.v;
      Array.prototype.forEach.call(document.querySelectorAll("#fPri [data-v]"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.v === editing.pri));
      });
      return;
    }
    if (target.closest("#fSave")) { saveEditor(); return; }
    if (target.closest("#fCancel")) { closeEditor(); return; }
    if (target.closest("#fDelete")) {
      var id = editing && editing.id;
      closeEditor();
      if (id) deleteCard(id);
      return;
    }
    if (target.id === "backdrop") { closeSheet(); return; }

    // toolbar
    if (target.closest("#clearSearch")) {
      $("search").value = "";
      view.query = "";
      $("clearSearch").hidden = true;
      render();
      return;
    }
    if (target.closest("#btnReset")) {
      askConfirm({
        title: t("reset.title"),
        body: t("reset.body"),
        ok: t("reset.ok"),
        danger: true,
        onOk: function () {
          state = seedState();
          view.filter = "all";
          commit();
          toast(t("toast.reset"));
        }
      });
      return;
    }
    if (target.closest("#btnExport")) { doExport(); return; }
    if (target.closest("#btnImport")) { $("fileInput").click(); return; }
  });

  function runColAction(act, colId) {
    var i = colIndex(colId);
    var col = B().columns[i];
    if (!col) return;
    view.menuFor = null;
    render();

    if (act === "rename") {
      askText({
        title: t("rename.title"),
        label: t("addCol.label"),
        value: col.title,
        ok: t("common.save"),
        onOk: function (name) { col.title = name; commit(); }
      });
    } else if (act === "sort") {
      col.cards.sort(function (a, b) {
        var da = B().cards[a].due, db = B().cards[b].due;
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da < db ? -1 : da > db ? 1 : 0;
      });
      commit();
      toast(t("toast.sorted", { t: col.title }));
    } else if (act === "toggle-done") {
      col.done = !col.done;
      col.cards.forEach(function (id) {
        B().cards[id].doneAt = col.done ? (B().cards[id].doneAt || Date.now()) : 0;
      });
      commit();
    } else if (act === "clear") {
      if (!col.cards.length) { toast(t("toast.colEmpty")); return; }
      askConfirm({
        title: t("clearCol.title", { t: col.title }),
        body: t("clearCol.body", { n: col.cards.length }),
        ok: t("clearCol.ok", { n: col.cards.length }),
        danger: true,
        onOk: function () {
          col.cards.forEach(function (id) { delete B().cards[id]; });
          col.cards = [];
          commit();
        }
      });
    } else if (act === "del-col") {
      if (B().columns.length === 1) { toast(t("toast.needOneCol")); return; }
      var dest = B().columns[i === 0 ? 1 : 0];
      askConfirm({
        title: t("delCol.title", { t: col.title }),
        body: col.cards.length
          ? t("delCol.bodyMove", { n: col.cards.length, to: dest.title })
          : t("delCol.bodyEmpty"),
        ok: t("delCol.ok"),
        danger: true,
        onOk: function () {
          var at = colIndex(col.id);
          if (at === -1) return;
          dest.cards = dest.cards.concat(col.cards);
          if (!dest.done) col.cards.forEach(function (id) { B().cards[id].doneAt = 0; });
          B().columns.splice(at, 1);
          commit();
        }
      });
    }
  }

  /* ═══ keyboard ══════════════════════════════════════════════ */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("backdrop").hidden) { closeSheet(); return; }
      if (view.composing) { view.composing = null; render(); return; }
      if (view.menuFor) { view.menuFor = null; render(); return; }
      if (view.boardMenu) { view.boardMenu = false; render(); return; }
    }

    if (e.target.id === "checkInput" && e.key === "Enter") {
      e.preventDefault();
      if (editing && e.target.value.trim()) addCheck(editing.id, e.target.value);
      return;
    }

    if (e.target.id === "composerInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      var val = e.target.value.trim();
      if (val) addCard(view.composing, val);
      return;
    }

    // Ctrl+Enter in the log box adds an entry; elsewhere in the editor it saves
    if (e.target.id === "logInput" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      submitLog();
      return;
    }

    if (editing && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      saveEditor();
      return;
    }

    if (e.key === "Enter" && e.target.classList &&
        (e.target.classList.contains("card") || e.target.classList.contains("row"))) {
      e.preventDefault();
      openEditor(e.target.dataset.card);
    }
  });

  /* ═══ load-strip tooltip ════════════════════════════════════ */
  function showTip(dayBtn) {
    var tip = $("tip");
    var plot = $("plot");
    if (!tip || !plot) return;

    var iso = dayBtn.dataset.day;
    var due = openMatching().filter(function (c) { return c.due === iso; });
    var titles = due.slice(0, 3).map(function (c) {
      return esc(clip(c.title, 31));
    }).join("<br />");

    tip.innerHTML = '<b>' + esc(exactDate(iso)) + '</b> · ' + esc(t("tip.count", { n: due.length })) +
      (titles ? '<div class="t-list">' + titles +
        (due.length > 3 ? '<br />' + esc(t("tip.more", { n: due.length - 3 })) : "") + '</div>' : "");

    var pr = plot.getBoundingClientRect();
    var br = dayBtn.getBoundingClientRect();
    tip.hidden = false;

    // measure after the content is in — width and height both vary with the day
    var half = tip.offsetWidth / 2;
    var x = br.left - pr.left + br.width / 2;
    tip.style.left = Math.min(Math.max(x, half + 2), pr.width - half - 2) + "px";

    // sit above the bar, or flip below it when the caption is in the way
    var bar = dayBtn.querySelector(".bar").getBoundingClientRect();
    var caption = plot.parentNode.querySelector(".chart-caption");
    var ceiling = caption ? caption.getBoundingClientRect().bottom : pr.top;
    var above = bar.top - 8 - tip.offsetHeight;
    tip.style.top = (above >= ceiling ? above - pr.top : bar.bottom - pr.top + 8) + "px";
  }

  function hideTip() {
    var tip = $("tip");
    if (tip) tip.hidden = true;
  }

  document.addEventListener("mouseover", function (e) {
    var day = e.target.closest ? e.target.closest("[data-day]") : null;
    if (day) showTip(day);
  });
  document.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest("[data-day]")) hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var day = e.target.closest ? e.target.closest("[data-day]") : null;
    if (day) showTip(day);
  });
  document.addEventListener("focusout", function (e) {
    if (e.target.closest && e.target.closest("[data-day]")) hideTip();
  });

  /* Hue drags live: paint on input, persist on release. */
  document.addEventListener("input", function (e) {
    if (e.target.id !== "hue") return;
    view.hue = Number(e.target.value);
    document.documentElement.style.setProperty("--bg-h", String(view.hue));
    var val = $("hueVal");
    if (val) val.textContent = view.hue + "°";
  });
  document.addEventListener("change", function (e) {
    if (e.target.id !== "hue") return;
    saveUi();
    // refresh the swatches so they track the new hue
    if ($("hue")) openSettings();
  });

  $("search").addEventListener("input", function (e) {
    view.query = e.target.value;
    $("clearSearch").hidden = !e.target.value;
    render();
  });

  /* ═══ backup ════════════════════════════════════════════════ */
  function doExport() {
    var text = JSON.stringify(state, null, 2);
    var pretty = t("file.name") + "-" + todayIso() + ".json";

    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "board-" + todayIso() + ".json", data: text })
        .then(function () { toast(t("toast.saved")); })
        .catch(function (err) {
          if (err && err.code === "declined") return;
          fallbackDownload(pretty, text);
        });
      return;
    }
    fallbackDownload(pretty, text);
  }

  function fallbackDownload(name, text) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast(t("toast.saved"));
    } catch (e) {
      toast(t("toast.dlFail"));
    }
  }

  $("fileInput").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try { incoming = sanitize(JSON.parse(String(reader.result))); }
      catch (err) { incoming = null; }
      if (!incoming) { toast(t("toast.importBad")); return; }
      var n = incoming.boards.reduce(function (a, bd) {
        return a + Object.keys(bd.cards).length;
      }, 0);
      askConfirm({
        title: t("import.title"),
        body: t("import.body", { n: n }),
        ok: t("import.ok"),
        danger: true,
        onOk: function () {
          state = incoming;
          view.filter = "all";
          commit();
          toast(t("toast.imported", { n: n }));
        }
      });
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ═══ boot ══════════════════════════════════════════════════ */
  if (!canStore) showWarn(t("warn.noStore"));

  window.addEventListener("resize", sizeBoard);

  document.addEventListener("change", function (e) {
    if (e.target.id !== "fileUp") return;
    var f = e.target.files && e.target.files[0];
    if (f && editing) uploadFile(editing.id, f);
    e.target.value = "";
  });

  /* Best-effort final push — the page may be closed before it lands, which
     is why the timed push exists as well. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "hidden") return;
    if (!view.autoSync || !mcpReady() || sync.off) return;
    if ((state.touchedAt || 0) <= (state.syncedAt || 0)) return;
    window.clearTimeout(pushTimer);
    drivePush(true);
  });

  applyStatic();
  save();
  render();
  renderSync();
  drivePull(false);
  window.setTimeout(calSyncAll, 1200);
})();
</script>
