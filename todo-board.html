<title>กระดานงานของเจโน่</title>

<style>
  /* ─── tokens ─────────────────────────────────────────────── */
  :root {
    --ground: #eaeeec;
    --surface: #fbfcfc;
    --surface-2: #f1f5f3;
    --surface-3: #e3e9e6;
    --ink: #121b1a;
    --ink-2: #3b4a47;
    --muted: #66766f;
    --line: #d2dad7;
    --line-strong: #b8c4c0;

    --accent: #14655c;
    --accent-ink: #0c4b44;
    --accent-soft: #d8e9e5;
    --on-accent: #ffffff;

    --danger: #a93b2a;
    --danger-soft: #f6e2dd;
    --warn: #92620f;
    --warn-soft: #f6ead2;
    --ok: #3e7a44;
    --ok-soft: #dfeddf;

    --shadow-1: 0 1px 2px rgba(18, 27, 26, .07);
    --shadow-2: 0 1px 2px rgba(18, 27, 26, .06), 0 8px 20px -10px rgba(18, 27, 26, .28);
    --shadow-drag: 0 12px 28px -8px rgba(18, 27, 26, .35);

    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;

    --sans: "IBM Plex Sans Thai", "Noto Sans Thai",
      "Leelawadee UI", "Sarabun", "Thonburi", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  /* Font choices. Webfont CDNs are blocked, so every option is a stack of
     faces the device already has, each with Thai and Latin coverage. */
  :root[data-font="loop"] {
    --sans: "IBM Plex Sans Thai Looped", "Noto Sans Thai Looped", "Sarabun",
      "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  }
  :root[data-font="serif"] {
    --sans: "Noto Serif Thai", "Sarabun", "Charter", "Iowan Old Style",
      Georgia, "Times New Roman", serif;
  }
  :root[data-font="system"] {
    --sans: system-ui, -apple-system, "Segoe UI", "Leelawadee UI",
      "Noto Sans Thai", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-font="mono"] {
    --sans: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo,
      "Noto Sans Thai", "Leelawadee UI", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1413;
      --surface: #171f1e;
      --surface-2: #1d2726;
      --surface-3: #253130;
      --ink: #e4eae8;
      --ink-2: #b6c3bf;
      --muted: #8a9995;
      --line: #283433;
      --line-strong: #3b4a47;

      --accent: #4fb8a8;
      --accent-ink: #93ddd0;
      --accent-soft: #12302c;
      --on-accent: #06201d;

      --danger: #e08272;
      --danger-soft: #37201c;
      --warn: #dba652;
      --warn-soft: #332718;
      --ok: #82c184;
      --ok-soft: #1c2b1d;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
      --shadow-drag: 0 12px 28px -8px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0e1413;
    --surface: #171f1e;
    --surface-2: #1d2726;
    --surface-3: #253130;
    --ink: #e4eae8;
    --ink-2: #b6c3bf;
    --muted: #8a9995;
    --line: #283433;
    --line-strong: #3b4a47;
    --accent: #4fb8a8;
    --accent-ink: #93ddd0;
    --accent-soft: #12302c;
    --on-accent: #06201d;
    --danger: #e08272;
    --danger-soft: #37201c;
    --warn: #dba652;
    --warn-soft: #332718;
    --ok: #82c184;
    --ok-soft: #1c2b1d;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
    --shadow-drag: 0 12px 28px -8px rgba(0, 0, 0, .8);
  }

  :root[data-theme="light"] {
    --ground: #eaeeec;
    --surface: #fbfcfc;
    --surface-2: #f1f5f3;
    --surface-3: #e3e9e6;
    --ink: #121b1a;
    --ink-2: #3b4a47;
    --muted: #66766f;
    --line: #d2dad7;
    --line-strong: #b8c4c0;
    --accent: #14655c;
    --accent-ink: #0c4b44;
    --accent-soft: #d8e9e5;
    --on-accent: #ffffff;
    --danger: #a93b2a;
    --danger-soft: #f6e2dd;
    --warn: #92620f;
    --warn-soft: #f6ead2;
    --ok: #3e7a44;
    --ok-soft: #dfeddf;
    --shadow-1: 0 1px 2px rgba(18, 27, 26, .07);
    --shadow-2: 0 1px 2px rgba(18, 27, 26, .06), 0 8px 20px -10px rgba(18, 27, 26, .28);
    --shadow-drag: 0 12px 28px -8px rgba(18, 27, 26, .35);
  }

  /* ─── base ───────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  /* ─── page background ────────────────────────────────────────
     JS sets only --bg-h (a hue). The stop colours are redefined per
     theme below, so every background style follows light/dark on its
     own without JS having to know which theme is showing. */
  :root {
    --bg-h: 168;
    --bg-a: hsl(var(--bg-h) 38% 96%);
    --bg-b: hsl(calc(var(--bg-h) + 38) 46% 85%);
    --bg-c: hsl(calc(var(--bg-h) - 34) 40% 90%);
    --page-bg: var(--ground);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-a: hsl(var(--bg-h) 26% 9%);
      --bg-b: hsl(calc(var(--bg-h) + 38) 38% 14%);
      --bg-c: hsl(calc(var(--bg-h) - 34) 30% 12%);
    }
  }
  :root[data-theme="dark"] {
    --bg-a: hsl(var(--bg-h) 26% 9%);
    --bg-b: hsl(calc(var(--bg-h) + 38) 38% 14%);
    --bg-c: hsl(calc(var(--bg-h) - 34) 30% 12%);
  }
  :root[data-theme="light"] {
    --bg-a: hsl(var(--bg-h) 26% 95%);
    --bg-b: hsl(calc(var(--bg-h) + 38) 30% 88%);
    --bg-c: hsl(calc(var(--bg-h) - 34) 26% 92%);
  }

  :root[data-bg="solid"] { --page-bg: var(--bg-a); }
  :root[data-bg="linear"] {
    --page-bg: linear-gradient(155deg, var(--bg-a) 0%, var(--bg-b) 100%);
  }
  :root[data-bg="radial"] {
    --page-bg: radial-gradient(125% 95% at 12% -5%, var(--bg-a) 0%, var(--bg-b) 72%);
  }
  :root[data-bg="mesh"] {
    --page-bg:
      radial-gradient(58% 52% at 10% 6%, var(--bg-c) 0%, transparent 62%),
      radial-gradient(52% 48% at 90% 10%, var(--bg-b) 0%, transparent 64%),
      radial-gradient(68% 58% at 48% 102%, var(--bg-b) 0%, transparent 66%),
      var(--bg-a);
  }

  body {
    margin: 0;
    background: var(--page-bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button, input, textarea, select { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    gap: 0;
  }

  .wrap {
    width: 100%;
    max-width: 1280px;
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 32px);
  }

  /* ─── masthead ───────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding-block: 20px 18px;
  }

  .masthead-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(21px, 2.6vw, 27px);
    font-weight: 700;
    letter-spacing: -.015em;
    text-wrap: balance;
    line-height: 1.25;
  }

  .brand .stamp {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }

  .brand p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    max-width: 62ch;
  }

  .masthead-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ─── buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s, border-color .14s, color .14s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted); color: var(--ink); }
  .btn:active { transform: translateY(.5px); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .btn-primary:hover {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: var(--ground);
  }

  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }

  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: 26px; height: 26px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    transition: background .14s, color .14s;
  }
  .icon-btn:hover { background: var(--surface-3); color: var(--ink); }

  /* ─── board tabs ─────────────────────────────────────────── */
  .boards {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .boards::-webkit-scrollbar { display: none; }

  .board-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    padding: 5px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, border-color .14s, color .14s;
  }
  .board-tab:hover { background: var(--surface-2); color: var(--ink); }
  .board-tab[aria-current="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .board-tab .n {
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    opacity: .75;
  }

  .board-add {
    flex: none;
    width: 26px; height: 26px;
    border: 1px dashed var(--line-strong);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    font-size: 15px;
  }
  .board-add:hover { color: var(--accent); border-color: var(--accent); }

  .board-menu-wrap { position: relative; flex: none; margin-left: auto; }
  .board-menu-wrap .menu { top: 30px; }

  .scope-panel { padding: 0; }
  .scope-panel .controls { border-bottom: 0; }

  .chip.repeat { background: transparent; border: 1px solid var(--accent); color: var(--accent-ink); }
  .chip.stale { background: var(--warn-soft); color: var(--warn); }
  .chip.from-board { background: var(--surface-3); color: var(--ink-2); font-weight: 500; }

  /* ─── view nav ───────────────────────────────────────────── */
  .nav {
    display: flex;
    gap: 2px;
    margin-top: 14px;
    margin-bottom: -18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav button {
    position: relative;
    padding: 7px 13px 10px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
  }
  .nav button::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px; bottom: 0;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
  }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); font-weight: 650; }
  .nav button[aria-current="page"]::after { background: var(--accent); }

  .nav .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--danger);
    color: var(--surface);
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    vertical-align: 1.5px;
  }

  /* ─── summary pages ──────────────────────────────────────── */
  .page {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-bottom: 44px;
  }
  .page[hidden] { display: none; }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head .rule {
    width: 3px;
    align-self: stretch;
    border-radius: 2px;
    background: var(--line-strong);
    margin: -1px 3px -1px -6px;
  }
  .panel-head h2 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: -.008em;
  }
  .panel-head .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0;
  }
  .panel-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex: none;
  }

  .panel.sev-over .panel-head .rule { background: var(--danger); }
  .panel.sev-over .panel-head h2 { color: var(--danger); }
  .panel.sev-today .panel-head .rule { background: var(--warn); }
  .panel.sev-today .panel-head h2 { color: var(--warn); }
  .panel.sev-next .panel-head .rule { background: var(--accent); }
  .panel.sev-done .panel-head .rule { background: var(--ok); }
  .panel.sev-done { background: transparent; }

  .rows { display: flex; flex-direction: column; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
  }
  .rows > .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }

  .tick {
    flex: none;
    width: 17px; height: 17px;
    margin-top: 3px;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: transparent;
    font-size: 11px;
    line-height: 1;
    transition: border-color .12s, background .12s, color .12s;
  }
  .tick:hover { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .row.done-row .tick { border-color: var(--ok); background: var(--ok); color: var(--surface); }

  .row-main { flex: 1; min-width: 0; }
  .row-title {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .row.done-row .row-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  .row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .row-meta .pri-dot {
    width: 7px; height: 7px;
    border-radius: 2px;
    background: var(--line-strong);
    flex: none;
  }
  .row-meta .pri-dot.p-high { background: var(--danger); }
  .row-meta .pri-dot.p-mid { background: var(--warn); }

  .row-when {
    flex: none;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding-top: 1px;
  }
  .row-when .exact {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  @media (max-width: 520px) {
    .row { flex-wrap: wrap; }
    .row-when { width: 100%; align-items: flex-start; padding-left: 28px; }
  }

  .panel-empty {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* group headings inside the remaining/due pages */
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 16px;
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink-2);
  }
  .rows > .group-head:first-child { border-top: 0; }
  .group-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--muted);
  }
  .group-head .when {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0;
  }

  /* ─── controls row ───────────────────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
  }
  .control-group { display: flex; align-items: center; gap: 7px; }
  .control-group > span {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg {
    display: flex;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .seg button {
    padding: 4px 11px;
    border: 0;
    border-left: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
  }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: var(--surface-2); color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-weight: 600;
  }

  /* ─── 14-day load strip ──────────────────────────────────── */
  /* the chart panel opts out of clipping so the tooltip can sit above the plot */
  .panel-chart { overflow: visible; }

  .chart-wrap { padding: 16px 16px 12px; }

  .chart-caption {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chart-caption strong { font-size: 13.5px; font-weight: 600; }
  .chart-caption span { font-size: 12px; color: var(--muted); }
  @media (max-width: 620px) {
    .chart-caption { flex-direction: column; gap: 2px; }
  }

  .plot {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 78px;
    border-bottom: 1px solid var(--line);
  }

  .day {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: default;
  }
  .day .bar {
    width: 100%;
    max-width: 24px;
    background: var(--accent);
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: background .12s;
  }
  .day.empty .bar {
    background: var(--line-strong);
    height: 2px !important;
    border-radius: 0;
  }
  .day.is-today .bar { background: var(--accent-ink); }
  .day.weekend .bar { opacity: .62; }
  .day:hover .bar, .day:focus-visible .bar { background: var(--ink-2); }

  .day .cap {
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    margin-bottom: 3px;
    line-height: 1;
  }

  .axis {
    display: flex;
    gap: 2px;
    margin-top: 6px;
  }
  .axis .tick-lbl {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    line-height: 1.3;
  }
  .axis .tick-lbl.is-today { color: var(--accent-ink); font-weight: 600; }
  .axis .tick-lbl small {
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    letter-spacing: .02em;
  }

  .tip {
    position: absolute;
    z-index: 60;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--ground);
    border-radius: var(--r-md);
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow-2);
    max-width: 220px;
  }
  .tip[hidden] { display: none; }
  .tip b { font-weight: 600; }
  .tip .t-list { color: var(--line-strong); white-space: normal; }

  /* ─── pulse strip: the "what's on me right now" answer ───── */
  .pulse-band {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-block: 16px;
  }

  .pulse {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 620px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 11px 13px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-2);
    text-align: left;
    cursor: pointer;
    transition: border-color .14s, background .14s, box-shadow .14s;
    overflow: hidden;
  }
  .tile::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--muted);
    opacity: .45;
  }
  .tile:hover { border-color: var(--line-strong); }
  .tile[aria-pressed="true"] {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: var(--shadow-1);
  }
  .tile[aria-pressed="true"]::before { opacity: 1; }

  .tile .n {
    font-family: var(--mono);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .tile .lbl {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .tile.t-over::before { background: var(--danger); }
  .tile.t-over .n { color: var(--danger); }
  .tile.t-today::before { background: var(--warn); }
  .tile.t-today .n { color: var(--warn); }
  .tile.t-week::before { background: var(--accent); }
  .tile.t-open::before { background: var(--line-strong); }

  .tile .zero { color: var(--muted); }

  .pulse-note {
    margin: 10px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .pulse-note .dot {
    flex: none;
    width: 6px; height: 6px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--ok);
  }

  /* ─── toolbar ────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-block: 12px;
  }

  .search {
    position: relative;
    flex: 1 1 220px;
    min-width: 180px;
    max-width: 340px;
  }
  .search input {
    width: 100%;
    padding: 7px 30px 7px 30px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: 13.5px;
  }
  .search input::placeholder { color: var(--muted); }
  .search .mag {
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: grid;
  }
  .search .clr {
    position: absolute;
    right: 5px; top: 50%;
    transform: translateY(-50%);
  }

  .spacer { flex: 1 1 auto; }

  .filter-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px 5px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: 12.5px;
    font-weight: 500;
  }

  /* ─── board ──────────────────────────────────────────────── */
  .board-scroll {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 28px;
  }

  .board {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding-inline: clamp(16px, 3vw, 32px);
    width: max-content;
    min-width: 100%;
  }

  .col {
    flex: 0 0 292px;
    width: 292px;
    display: flex;
    flex-direction: column;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    max-height: var(--col-max, calc(100vh - 340px));
  }
  .col.is-done { background: transparent; border-style: dashed; }

  /* On a phone the board sits below a tall header — let columns grow and
     scroll the page instead of hiding a scrollbar past the fold. */
  @media (max-width: 700px) {
    .col { max-height: none; }
  }

  .col-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 10px 9px 13px;
    border-bottom: 1px solid var(--line);
  }

  .col-head .swatch {
    width: 8px; height: 8px;
    border-radius: 2px;
    background: var(--accent);
    flex: none;
  }
  .col.is-done .col-head .swatch { background: var(--ok); }

  .col-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.005em;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .count {
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: var(--surface-3);
    border-radius: 999px;
    padding: 1px 7px;
    flex: none;
  }

  .col-menu { position: relative; flex: none; }

  .menu {
    position: absolute;
    right: 0; top: 30px;
    z-index: 40;
    min-width: 194px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-2);
    padding: 4px;
    display: flex;
    flex-direction: column;
  }
  .menu button {
    text-align: left;
    padding: 7px 10px;
    border: 0;
    border-radius: var(--r-sm);
    background: transparent;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .menu button:hover { background: var(--surface-2); color: var(--ink); }
  .menu button.danger { color: var(--danger); }
  .menu button.danger:hover { background: var(--danger-soft); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }

  .col-body {
    flex: 1;
    overflow-y: auto;
    padding: 9px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 54px;
  }
  .col-body.drag-over { background: var(--accent-soft); border-radius: 0 0 var(--r-lg) var(--r-lg); }

  .col-foot { padding: 0 9px 9px; }
  .add-card {
    width: 100%;
    justify-content: flex-start;
    border-style: dashed;
    border-color: var(--line-strong);
    color: var(--muted);
    background: transparent;
  }
  .add-card:hover { color: var(--accent); border-color: var(--accent); background: var(--surface); }

  .col-empty {
    padding: 14px 4px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ─── card ───────────────────────────────────────────────── */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-1);
    padding: 9px 10px 9px 13px;
    cursor: grab;
    transition: box-shadow .14s, border-color .14s, transform .1s;
  }
  .card:hover { box-shadow: var(--shadow-2); border-color: var(--line-strong); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .45; box-shadow: var(--shadow-drag); }

  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--line-strong);
  }
  .card.p-high::before { background: var(--danger); }
  .card.p-mid::before { background: var(--warn); }
  .card.p-low::before { background: var(--line-strong); }

  .card.is-done { background: transparent; box-shadow: none; }
  .card.is-done .card-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .card.is-done::before { background: var(--ok); }

  .card-title {
    font-size: 13.8px;
    line-height: 1.45;
    margin: 0;
    word-break: break-word;
  }

  .card-note {
    margin: 4px 0 0;
    font-size: 12.3px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-clamp: 2;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 7px;
  }
  .card-meta:empty { display: none; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: var(--r-sm);
    font-size: 11.5px;
    font-weight: 500;
    background: var(--surface-3);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.due { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .chip.due-over { background: var(--danger-soft); color: var(--danger); }
  .chip.due-today { background: var(--warn-soft); color: var(--warn); }
  .chip.due-soon { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.tag { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .chip.note-flag { background: transparent; color: var(--muted); padding-inline: 2px; }

  .card-move {
    display: flex;
    gap: 2px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity .14s;
  }
  .card:hover .card-move,
  .card:focus-within .card-move { opacity: 1; }
  @media (hover: none) { .card-move { opacity: 1; } }

  .card-move button {
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-2);
    color: var(--muted);
    cursor: pointer;
    line-height: 1.6;
  }
  .card-move button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .card-move button:disabled { opacity: .32; cursor: default; }

  .drop-line {
    height: 2px;
    border-radius: 2px;
    background: var(--accent);
    margin: -3px 0;
  }

  /* ─── composer ───────────────────────────────────────────── */
  .composer {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--r-md);
    padding: 8px;
    box-shadow: var(--shadow-2);
  }
  .composer textarea {
    width: 100%;
    border: 0;
    background: transparent;
    resize: none;
    font-size: 13.8px;
    line-height: 1.45;
    outline: none;
    min-height: 44px;
  }
  .composer-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .composer-row .hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }

  /* ─── add column ─────────────────────────────────────────── */
  .add-col {
    flex: 0 0 216px;
    width: 216px;
    padding: 11px 13px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-lg);
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
  }
  .add-col:hover { color: var(--accent); border-color: var(--accent); background: var(--surface-2); }

  /* ─── empty board ────────────────────────────────────────── */
  .blank {
    margin: 6px 0 20px;
    padding: 26px 24px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-lg);
    background: var(--surface);
    max-width: 520px;
  }
  .blank h3 { margin: 0 0 6px; font-size: 16px; }
  .blank p { margin: 0; color: var(--muted); font-size: 13.5px; }

  /* ─── modal ──────────────────────────────────────────────── */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 18, 17, .42);
    backdrop-filter: blur(2px);
    display: grid;
    place-items: start center;
    padding: clamp(16px, 6vh, 72px) 16px 32px;
    overflow-y: auto;
  }
  .backdrop[hidden] { display: none; }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    padding: 20px;
  }
  .sheet h2 {
    margin: 0 0 2px;
    font-size: 16.5px;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .sheet .sub { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
  .field > label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input[type="text"],
  .field input[type="date"],
  .field textarea,
  .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 62px; line-height: 1.5; }
  .field .help { font-size: 11.5px; color: var(--muted); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } }

  .segmented { display: flex; gap: 6px; }
  .segmented button {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .segmented button .pip { width: 7px; height: 7px; border-radius: 2px; background: currentColor; opacity: .55; }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
  .segmented button[aria-pressed="true"] .pip { opacity: 1; }
  .segmented button[data-v="high"] { color: var(--danger); }
  .segmented button[data-v="mid"] { color: var(--warn); }

  .quick-dates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .quick-dates button {
    padding: 3px 9px;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .quick-dates button:hover { color: var(--accent); border-color: var(--accent); }

  .sheet-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  .sheet-foot .spacer { flex: 1; }

  /* ─── activity log on a task ─────────────────────────────── */
  .log {
    margin-top: 16px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  .log-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .log-head h3 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .log-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .log-hint {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .log-list {
    max-height: 260px;
    overflow-y: auto;
    margin-bottom: 11px;
  }
  .log-list:empty { display: none; }

  .log-day {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    letter-spacing: .02em;
    padding: 14px 0 7px;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .log-list > .log-day:first-child { padding-top: 2px; }

  /* the rail makes a day's entries read as one thread */
  .log-entry {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 5px 0 6px 13px;
  }
  .log-entry::before {
    content: "";
    position: absolute;
    left: 3px; top: 0; bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .log-entry::after {
    content: "";
    position: absolute;
    left: 0; top: 12px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--line-strong);
    border: 2px solid var(--surface);
    box-sizing: content-box;
    margin-left: -2px;
  }
  .log-entry:last-child::before { bottom: 12px; }

  .log-text {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-time {
    flex: none;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    padding-top: 3px;
  }
  .log-del {
    flex: none;
    opacity: 0;
    transition: opacity .12s;
  }
  .log-entry:hover .log-del,
  .log-entry:focus-within .log-del { opacity: 1; }
  @media (hover: none) { .log-del { opacity: 1; } }

  .log-add { display: flex; flex-direction: column; gap: 7px; }
  .log-add textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 13.5px;
    line-height: 1.5;
    resize: vertical;
    min-height: 56px;
  }
  .log-add-row { display: flex; align-items: center; gap: 8px; }
  .log-add-row .hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }

  .log-empty {
    margin: 0 0 11px;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ─── checklist ──────────────────────────────────────────── */
  .check-bar {
    height: 3px;
    border-radius: 2px;
    background: var(--surface-3);
    overflow: hidden;
    margin: 2px 0 10px;
  }
  .check-bar span { display: block; height: 100%; background: var(--ok); border-radius: 2px; }

  .check-list { display: flex; flex-direction: column; margin-bottom: 11px; }
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 5px 0;
  }
  .check-row .tick { margin-top: 1px; }
  .check-row[class*="is-done"] .check-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }
  .check-row.is-done .tick { border-color: var(--ok); background: var(--ok); color: var(--surface); }
  .check-text { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; word-break: break-word; }
  .check-del { flex: none; opacity: 0; transition: opacity .12s; }
  .check-row:hover .check-del, .check-row:focus-within .check-del { opacity: 1; }
  @media (hover: none) { .check-del { opacity: 1; } }

  .log-add input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 13.5px;
  }

  /* ─── attachments ────────────────────────────────────────── */
  .file-list { display: flex; flex-direction: column; margin-bottom: 11px; }
  .file-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }
  .file-list > .file-row:first-child { border-top: 0; }
  .file-name {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-size {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .chip.checks { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .chip.checks.all-done { border-color: var(--ok); color: var(--ok); }
  .chip.files { background: transparent; border: 1px solid var(--line); color: var(--muted); }

  /* comment count marker on cards and summary rows */
  .chip.log-count { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .chip.log-count.hot { border-color: var(--accent); color: var(--accent-ink); }

  /* ─── background picker ──────────────────────────────────── */
  .bg-kinds { display: flex; gap: 6px; flex-wrap: wrap; }
  .bg-kind {
    flex: 1 1 0;
    min-width: 68px;
    padding: 0;
    border: 1px solid var(--line-strong);

  var FONTS = ["sans", "loop", "serif", "system", "mono"];
  var BGS = ["default", "solid", "linear", "radial", "mesh"];

  var CAL_RANGES = [7, 14, 30];
  var STALE_DAYS = 21;

  function t(key, vars) {
    // English needs singular forms; Thai has no plural, so it simply has no ".one" keys
    if (vars && vars.n === 1 && STR[view.lang][key + ".one"] !== undefined) key += ".one";
    var s = STR[view.lang][key];
    if (s === undefined) s = STR.th[key];
    if (s === undefined) return key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        s = s.split("{" + k + "}").join(vars[k]);
      });
    }
    return s;
  }
  function L() { return STR[view.lang]; }

  /* ═══ dates ═════════════════════════════════════════════════ */
  function isoOf(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function todayIso() { return isoOf(new Date()); }
  function shiftIso(days) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + days);
    return isoOf(d);
  }
  function daysUntil(iso) {
    if (!iso) return null;
    var p = iso.split("-").map(Number);
    if (p.length !== 3 || !p[0]) return null;
    var due = new Date(p[0], p[1] - 1, p[2]);
    var now = new Date();
    due.setHours(0, 0, 0, 0);
    now.setHours(0, 0, 0, 0);
    return Math.round((due - now) / 86400000);
  }
  function prettyDate(iso) {
    var p = iso.split("-").map(Number);
    var m = L().month[p[1] - 1];
    return view.lang === "en" ? m + " " + p[2] : p[2] + " " + m;
  }
  function exactDate(iso) {
    var p = iso.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return L().dow[d.getDay()] + " " + prettyDate(iso);
  }
  function dueLabel(iso) {
    var n = daysUntil(iso);
    if (n === null) return { text: "", cls: "" };
    if (n < -1) return { text: t("dueL.overN", { n: Math.abs(n) }), cls: "due-over" };
    if (n === -1) return { text: t("dueL.over1"), cls: "due-over" };
    if (n === 0) return { text: t("dueL.today"), cls: "due-today" };
    if (n === 1) return { text: t("dueL.tmr"), cls: "due-soon" };
    if (n <= 7) return { text: t("dueL.inN", { n: n }), cls: "due-soon" };
    return { text: prettyDate(iso), cls: "" };
  }
  function localeDate(ms, opts) {
    try { return new Date(ms).toLocaleDateString(L().locale, opts); }
    catch (e) { return prettyDate(isoOf(new Date(ms))); }
  }
  function localeTime(ms) {
    try {
      return new Date(ms).toLocaleTimeString(L().locale, { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      var d = new Date(ms);
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
  }

  /* ═══ state ═════════════════════════════════════════════════ */
  var uidSeq = 0;
  function uid(p) {
    uidSeq += 1;
    return p + "_" + Date.now().toString(36) + uidSeq.toString(36) +
      Math.random().toString(36).slice(2, 6);
  }

  var SEED = {

  function seed() {
    var S = SEED[view.lang] || SEED.th;
    var cards = {};
    function mk(spec) {
      var c = {
        id: uid("k"), title: spec[0], note: spec[1] || "",
        due: spec[2] === null ? "" : shiftIso(spec[2]),
        pri: spec[3], tags: spec[4] || [], log: [], repeat: spec[5] || "",
        calEventId: "", calDue: "", checks: [], files: [],
        created: Date.now(), movedAt: Date.now(), editedAt: Date.now(), doneAt: 0
      };
      cards[c.id] = c;
      return c.id;
    }
    var ids = S.cards.map(mk);
    var cols = [
      { id: uid("c"), title: S.cols[0], done: false, cards: [ids[0], ids[1], ids[2]] },
      { id: uid("c"), title: S.cols[1], done: false, cards: [ids[3]] },
      { id: uid("c"), title: S.cols[2], done: false, cards: [ids[4]] },
      { id: uid("c"), title: S.cols[3], done: true, cards: [ids[5]] }
    ];
    cards[ids[5]].doneAt = Date.now();

    // the sample project card carries a short history so the log reads as a thread
    var day = 86400000;
    cards[ids[3]].log = S.log.map(function (text, i) {
      return { id: uid("g"), text: text, at: Date.now() - (S.log.length - i) * day * 2 };
    });

    return { id: uid("b"), title: S.board, columns: cols, cards: cards, created: Date.now() };
  }

  function seedState() {
    var first = seed();
    return {
      v: 3, boards: [first], activeBoard: first.id,
      syncedAt: 0, touchedAt: 0, seenDriveAt: 0, deleted: {}
    };
  }

  /* The active board. Everything that used to read state.columns /
     state.cards goes through here. */
  function B() {
    for (var i = 0; i < state.boards.length; i++) {
      if (state.boards[i].id === state.activeBoard) return state.boards[i];
    }
    return state.boards[0];
  }
  function boardIndex(id) {
    for (var i = 0; i < state.boards.length; i++) {
      if (state.boards[i].id === id) return i;
    }
    return -1;
  }
  /* Cards from every board, tagged with the board they came from —
     what the summary pages use when scope is "all boards". */
  /* Tag a card with the board it came from WITHOUT making it serialisable —
     board.cards[id].__board === board is a cycle that would break every
     JSON.stringify (saving, Drive push, duplicating a board). */
  function tagBoard(card, bd) {
    Object.defineProperty(card, "__board", {
      value: bd, enumerable: false, configurable: true, writable: true
    });
    return card;
  }

  function everyBoardOpenCards() {
    var out = [];
    state.boards.forEach(function (bd) {
      bd.columns.forEach(function (col) {
        if (col.done) return;
        col.cards.forEach(function (id) {
          var c = bd.cards[id];
          if (c) out.push(tagBoard(c, bd));
        });
      });
    });
    return out;
  }

  /* One board's worth of data, defensively rebuilt field by field. */
  function sanitizeBoard(raw, fallbackTitle) {
    if (!raw || typeof raw !== "object") return null;
    if (!Array.isArray(raw.columns) || !raw.cards || typeof raw.cards !== "object") return null;
    var cards = {};
    Object.keys(raw.cards).forEach(function (id) {
      var c = raw.cards[id];
      if (!c || typeof c.title !== "string") return;
      cards[id] = {
        id: id,
        title: c.title,
        note: typeof c.note === "string" ? c.note : "",
        due: typeof c.due === "string" && /^\d{4}-\d{2}-\d{2}$/.test(c.due) ? c.due : "",
        pri: c.pri === "high" || c.pri === "mid" ? c.pri : "low",
        tags: Array.isArray(c.tags) ? c.tags.filter(function (x) { return typeof x === "string"; }).slice(0, 8) : [],
        log: Array.isArray(c.log) ? c.log.filter(function (g) {
          return g && typeof g.text === "string";
        }).map(function (g) {
          return {
            id: typeof g.id === "string" ? g.id : uid("g"),
            text: g.text,
            at: typeof g.at === "number" ? g.at : Date.now()
          };
        }) : [],
        repeat: REPEATS.indexOf(c.repeat) > 0 ? c.repeat : "",
        calEventId: typeof c.calEventId === "string" ? c.calEventId : "",
        calDue: typeof c.calDue === "string" ? c.calDue : "",
        checks: Array.isArray(c.checks) ? c.checks.filter(function (k) {
          return k && typeof k.text === "string";
        }).map(function (k) {
          return { id: typeof k.id === "string" ? k.id : uid("x"), text: k.text, done: !!k.done };
        }) : [],
        files: Array.isArray(c.files) ? c.files.filter(function (fl) {
          return fl && typeof fl.name === "string" && typeof fl.url === "string";
        }).map(function (fl) {
          return {
            id: typeof fl.id === "string" ? fl.id : uid("f"),
            name: fl.name, url: fl.url,
            mime: typeof fl.mime === "string" ? fl.mime : "",
            size: typeof fl.size === "number" ? fl.size : 0,
            at: typeof fl.at === "number" ? fl.at : Date.now()
          };
        }) : [],
        editedAt: typeof c.editedAt === "number" ? c.editedAt : (typeof c.created === "number" ? c.created : Date.now()),
        created: typeof c.created === "number" ? c.created : Date.now(),
        movedAt: typeof c.movedAt === "number" ? c.movedAt : (typeof c.created === "number" ? c.created : Date.now()),
        doneAt: typeof c.doneAt === "number" ? c.doneAt : 0
      };
    });
    var seen = {};
    var columns = raw.columns.filter(function (col) {
      return col && typeof col.title === "string" && typeof col.id === "string";
    }).map(function (col) {
      return {
        id: col.id,
        title: col.title,
        done: !!col.done,
        cards: (Array.isArray(col.cards) ? col.cards : []).filter(function (id) {
          if (!cards[id] || seen[id]) return false;
          seen[id] = 1;
          return true;
        })
      };
    });
    if (!columns.length) return null;
    // any card not referenced by a column goes back to the first column
    Object.keys(cards).forEach(function (id) {
      if (!seen[id]) columns[0].cards.push(id);
    });
    return {
      id: typeof raw.id === "string" ? raw.id : uid("b"),
      title: typeof raw.title === "string" && raw.title ? raw.title : (fallbackTitle || t("board.untitled")),
      columns: columns,
      cards: cards,
      created: typeof raw.created === "number" ? raw.created : Date.now()
    };
  }

  /* Accepts both shapes: v3 carries a boards array, v2 was a single
     board at the top level and gets wrapped so old data still opens. */
  function sanitize(raw) {
    if (!raw || typeof raw !== "object") return null;
    var num = function (x) { return typeof x === "number" ? x : 0; };
    var boards = [];

    if (Array.isArray(raw.boards)) {
      raw.boards.forEach(function (bd, i) {
        var clean = sanitizeBoard(bd, t("board.untitled") + " " + (i + 1));
        if (clean) boards.push(clean);
      });
    } else {
      var only = sanitizeBoard(raw, null);
      if (only) boards.push(only);
    }
    if (!boards.length) return null;

    var active = raw.activeBoard;
    var known = boards.some(function (bd) { return bd.id === active; });

    return {
      v: 3,
      boards: boards,
      activeBoard: known ? active : boards[0].id,
      // sync bookkeeping, kept so it survives a reload
      syncedAt: num(raw.syncedAt),
      touchedAt: num(raw.touchedAt),
      seenDriveAt: num(raw.seenDriveAt),
      // id -> deletion time, so a merge never resurrects a deleted card
      deleted: (raw.deleted && typeof raw.deleted === "object") ? raw.deleted : {}
    };
  }

  /* ═══ view state ════════════════════════════════════════════ */
  var UI_KEY = KEY + ".ui";
  var view = {
    lang: "th", font: "sans", bg: "default", hue: 168,
    scope: "all", calDays: 14, boardMenu: false,
    autoCal: false, autoSync: false,
    page: "board", filter: "all", query: "",
    composing: null, menuFor: null, groupBy: "col", sortBy: "due"
  };

  if (canStore) {
    try {
      var savedUi = JSON.parse(window.localStorage.getItem(UI_KEY));
      if (savedUi && typeof savedUi === "object") {
        if (savedUi.lang === "th" || savedUi.lang === "en") view.lang = savedUi.lang;
        if (FONTS.indexOf(savedUi.font) !== -1) view.font = savedUi.font;
        if (BGS.indexOf(savedUi.bg) !== -1) view.bg = savedUi.bg;
        if (typeof savedUi.hue === "number" && savedUi.hue >= 0 && savedUi.hue <= 360) {
          view.hue = savedUi.hue;
        }
        if (typeof savedUi.page === "string") view.page = savedUi.page;
        if (typeof savedUi.groupBy === "string") view.groupBy = savedUi.groupBy;
        if (typeof savedUi.sortBy === "string") view.sortBy = savedUi.sortBy;
        if (savedUi.scope === "all" || savedUi.scope === "one") view.scope = savedUi.scope;
        if (CAL_RANGES.indexOf(savedUi.calDays) !== -1) view.calDays = savedUi.calDays;
        view.autoCal = !!savedUi.autoCal;
        view.autoSync = !!savedUi.autoSync;
      } else if (/^en\b/i.test(navigator.language || "")) {
        view.lang = "en";
      }
    } catch (e) { /* defaults are fine */ }
  }

  function saveUi() {
    if (!canStore) return;
    try {
      window.localStorage.setItem(UI_KEY, JSON.stringify({
        lang: view.lang, font: view.font, bg: view.bg, hue: view.hue,
        page: view.page, groupBy: view.groupBy, sortBy: view.sortBy,
        scope: view.scope, calDays: view.calDays,
        autoCal: view.autoCal, autoSync: view.autoSync
      }));
    } catch (e) { /* not worth warning about */ }
  }

  var state = (function () {
    if (canStore) {
      try {
        var parsed = sanitize(JSON.parse(window.localStorage.getItem(KEY)));
        if (parsed) return parsed;
      } catch (e) { /* fall through to seed */ }
    }
    return seedState();
  })();

  var storeBroken = false;
  function save() {
    if (!canStore) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      if (!storeBroken) {
        storeBroken = true;
        showWarn(t("warn.full"));
      }
    }
  }

  var undoBuf = null;
  var toastTimer = 0;

  /* ═══ helpers ═══════════════════════════════════════════════ */
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function colOf(cardId) {
    for (var i = 0; i < B().columns.length; i++) {
      if (B().columns[i].cards.indexOf(cardId) !== -1) return B().columns[i];
    }
    return null;
  }
  /* colOf only knows the active board. In cross-board scope a card
     belongs to another one, so resolve the column on its own board. */
  function homeColumn(card) {
    var bd = card.__board || B();
    for (var i = 0; i < bd.columns.length; i++) {
      if (bd.columns[i].cards.indexOf(card.id) !== -1) return bd.columns[i];
    }
    return null;
  }

  function colIndex(colId) {
    for (var i = 0; i < B().columns.length; i++) {
      if (B().columns[i].id === colId) return i;
    }
    return -1;
  }
  function openCards() {
    var out = [];
    B().columns.forEach(function (col) {
      if (col.done) return;
      col.cards.forEach(function (id) { if (B().cards[id]) out.push(B().cards[id]); });
    });
    return out;
  }
  function matches(card) {
    var q = view.query.trim().toLowerCase();
    if (q) {
      var hay = (card.title + " " + card.note + " " + card.tags.join(" ") + " " +
        (card.log || []).map(function (g) { return g.text; }).join(" ")).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (view.filter === "all") return true;
    var n = daysUntil(card.due);
    if (n === null) return false;
    if (view.filter === "overdue") return n < 0;
    if (view.filter === "today") return n === 0;
    if (view.filter === "week") return n >= 0 && n <= 7;
    return true;
  }

  function showWarn(msg) {
    $("warnText").textContent = msg;
    $("warnBar").hidden = false;
  }

  function toast(msg, actionLabel, action) {
    var el = $("toast");
    var btn = $("toastAction");
    $("toastText").textContent = msg;
    if (actionLabel) {
      btn.hidden = false;
      btn.textContent = actionLabel;
      btn.onclick = function () { el.hidden = true; action(); };
    } else {
      btn.hidden = true;
      btn.onclick = null;
    }
    el.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { el.hidden = true; }, actionLabel ? 7000 : 3200);
  }

  function clip(s, n) {
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  /* ═══ mutations ═════════════════════════════════════════════ */
  function markTouched() { state.touchedAt = Date.now(); }
  function commit() {
    markTouched();
    save();
    render();
    renderSync();
    scheduleAutoPush();
  }

  function addCard(colId, title) {
    var col = B().columns[colIndex(colId)];
    if (!col) return;
    var card = {
      id: uid("k"), title: title.trim(), note: "", due: "", pri: "low",
      tags: [], log: [], repeat: "", calEventId: "", calDue: "",
      checks: [], files: [],
      created: Date.now(), movedAt: Date.now(), editedAt: Date.now(),
      doneAt: col.done ? Date.now() : 0
    };
    B().cards[card.id] = card;
    col.cards.push(card.id);
    commit();
  }

  function place(cardId, toColId, resolveIndex) {
    var from = colOf(cardId);
    var to = B().columns[colIndex(toColId)];
    if (!from || !to) return;
    from.cards.splice(from.cards.indexOf(cardId), 1);
    var index = resolveIndex(to);
    if (index === null || index < 0 || index > to.cards.length) index = to.cards.length;
    to.cards.splice(index, 0, cardId);
    var card = B().cards[cardId];
    card.movedAt = Date.now();
    card.editedAt = Date.now();
    window.setTimeout(function () { calSyncCard(card); }, 0);
    if (to.done) {
      if (!card.doneAt) card.doneAt = Date.now();
      if (!from.done) spawnNextRound(card, from);
    } else card.doneAt = 0;
    commit();
  }

  /* A repeating task that lands in a done column leaves a fresh copy
     behind in the column it came from, with the date rolled forward. */
  function ROLL(iso, kind) {
    var base = iso ? new Date(iso.split("-")[0], Number(iso.split("-")[1]) - 1, iso.split("-")[2]) : new Date();
    base.setHours(12, 0, 0, 0);
    // never schedule the next round in the past
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var guard = 0;
    do {
      if (kind === "daily") base.setDate(base.getDate() + 1);
      else if (kind === "weekly") base.setDate(base.getDate() + 7);
      else if (kind === "biweekly") base.setDate(base.getDate() + 14);
      else if (kind === "monthly") base.setMonth(base.getMonth() + 1);
      else if (kind === "quarterly") base.setMonth(base.getMonth() + 3);
      else if (kind === "yearly") base.setFullYear(base.getFullYear() + 1);
      else return "";
      guard++;
    } while (base <= today && guard < 400);
    return isoOf(base);
  }

  function spawnNextRound(card, homeCol) {
    if (!card.repeat || REPEATS.indexOf(card.repeat) < 1) return;
    var nextDue = ROLL(card.due, card.repeat);
    if (!nextDue) return;
    var copy = {
      id: uid("k"), title: card.title, note: card.note, due: nextDue,
      pri: card.pri, tags: card.tags.slice(), log: [], repeat: card.repeat,
      calEventId: "", calDue: "", checks: card.checks.map(function (k) {
        return { id: uid("x"), text: k.text, done: false };
      }), files: [],
      created: Date.now(), movedAt: Date.now(), editedAt: Date.now(), doneAt: 0
    };
    B().cards[copy.id] = copy;
    var target = homeCol && !homeCol.done ? homeCol : B().columns[0];
    target.cards.push(copy.id);
    // the finished one stops repeating so the chain never forks
    card.repeat = "";
    window.setTimeout(function () {
      toast(t("repeat.spawned", { d: exactDate(nextDue) }));
    }, 30);
  }

  function staleDays(card) {
    if (card.due || card.doneAt) return 0;
    var since = card.movedAt || card.created || 0;
    if (!since) return 0;
    return Math.floor((Date.now() - since) / 86400000);
  }

  function moveCard(cardId, toColId, index) {
    place(cardId, toColId, function () { return index; });
  }

  /* Drops anchor to the card the drop line sits above, so the position is
     right even when a filter hides some of the column's cards. */
  function dropBefore(cardId, toColId, anchorId) {
    place(cardId, toColId, function (to) {
      return anchorId ? to.cards.indexOf(anchorId) : to.cards.length;
    });
  }

  function nudge(cardId, dir) {
    var from = colOf(cardId);
    if (!from) return;
    var target = B().columns[colIndex(from.id) + dir];
    if (!target) return;
    moveCard(cardId, target.id, target.cards.length);
  }

  function doneColumn() {
    for (var i = B().columns.length - 1; i >= 0; i--) {
      if (B().columns[i].done) return B().columns[i];
    }
    return null;
  }

  /* Tick a task off from any of the summary views. */
  function completeCard(cardId) {
    if (!B().cards[cardId]) {
      for (var i = 0; i < state.boards.length; i++) {
        if (state.boards[i].cards[cardId]) { state.activeBoard = state.boards[i].id; break; }
      }
    }
    var card = B().cards[cardId];
    var from = colOf(cardId);
    if (!card || !from) return;

    if (from.done) { openEditor(cardId); return; }

    var target = doneColumn();
    if (!target) { toast(t("toast.noDoneCol")); return; }

    var back = { colId: from.id, index: from.cards.indexOf(cardId) };
    moveCard(cardId, target.id, target.cards.length);
    toast(t("toast.closed", { t: clip(card.title, 27) }), t("toast.undo"), function () {
      moveCard(cardId, back.colId, back.index);
    });
  }

  function deleteCard(cardId) {
    var col = colOf(cardId);
    if (!col) return;
    var idx = col.cards.indexOf(cardId);
    undoBuf = { card: B().cards[cardId], colId: col.id, index: idx };
    col.cards.splice(idx, 1);
    delete B().cards[cardId];
    state.deleted[cardId] = Date.now();
    if (undoBuf.card.calEventId) {
      calQueue.push({ op: "remove", id: cardId, eventId: undoBuf.card.calEventId });
      runCalQueue();
    }
    commit();
    toast(t("toast.deleted", { t: clip(undoBuf.card.title, 29) }), t("toast.undo"), function () {
      if (!undoBuf) return;
      var c = B().columns[colIndex(undoBuf.colId)] || B().columns[0];
      B().cards[undoBuf.card.id] = undoBuf.card;
      c.cards.splice(Math.min(undoBuf.index, c.cards.length), 0, undoBuf.card.id);
      undoBuf = null;
      commit();
    });
  }

  /* ═══ the activity log on a task ════════════════════════════ */
  function logOf(card) { return card.log || (card.log = []); }

  function addLogEntry(cardId, text) {
    var card = B().cards[cardId];
    if (!card || !text.trim()) return;
    logOf(card).push({ id: uid("g"), text: text.trim(), at: Date.now() });
    markTouched();
    save();
    render();
    renderSync();
    renderLogSection(cardId, true);
  }

  function deleteLogEntry(cardId, entryId) {
    var card = B().cards[cardId];
    if (!card) return;
    var log = logOf(card);
    var i = -1;
    log.forEach(function (g, k) { if (g.id === entryId) i = k; });
    if (i === -1) return;

    var removed = log.splice(i, 1)[0];
    markTouched();
    save();
    render();
    renderSync();
    renderLogSection(cardId);
    toast(t("toast.logDeleted"), t("toast.undo"), function () {
      var c = B().cards[cardId];
      if (!c) return;
      logOf(c).splice(Math.min(i, logOf(c).length), 0, removed);
      save();
      render();
      if (editing && editing.id === cardId) renderLogSection(cardId);
    });
  }

  /* Entries group under a date heading so a run of client requests on the
     same day reads as one conversation. */
  function logListHtml(card) {
    var log = logOf(card).slice().sort(function (a, b) { return a.at - b.at; });
    if (!log.length) return '<p class="log-empty">' + esc(t("log.empty")) + '</p>';

    var out = "";
    var lastDay = "";
    log.forEach(function (g) {
      var day = isoOf(new Date(g.at));
      if (day !== lastDay) {
        lastDay = day;
        var n = daysUntil(day);
        var head = n === 0 ? t("log.today") : n === -1 ? t("log.yesterday") : exactDate(day);
        out += '<div class="log-day">' + esc(head) + '</div>';
      }
      out += '<div class="log-entry">' +
        '<p class="log-text">' + esc(g.text) + '</p>' +
        '<span class="log-time">' + esc(localeTime(g.at)) + '</span>' +
        '<button class="icon-btn log-del" type="button" data-log-del="' + g.id + '" ' +
          'aria-label="' + esc(t("log.del")) + '">✕</button>' +
        '</div>';
    });
    return '<div class="log-list">' + out + '</div>';
  }

  var MAX_UPLOAD_MB = 5;

  function touchCard(card) {
    if (card) card.editedAt = Date.now();
  }

  function checksHtml(card) {
    var list = card.checks || [];
    var done = list.filter(function (k) { return k.done; }).length;
    var rows = list.length
      ? '<div class="check-list">' + list.map(function (k) {
          return '<div class="check-row' + (k.done ? " is-done" : "") + '">' +
            '<button class="tick" type="button" data-check="' + k.id + '" ' +
              'aria-pressed="' + !!k.done + '">✓</button>' +
            '<span class="check-text">' + esc(k.text) + '</span>' +
            '<button class="icon-btn check-del" type="button" data-check-del="' + k.id + '" ' +
              'aria-label="' + esc(t("check.del")) + '">✕</button>' +
            '</div>';
        }).join("") + '</div>'
      : '<p class="log-empty">' + esc(t("check.empty")) + '</p>';

    return '<div class="log-head"><h3>' + esc(t("check.label")) + '</h3>' +
        (list.length ? '<span class="n">' + t("check.done", { a: done, b: list.length }) + '</span>' : '') +
      '</div>' +
      (list.length ? '<div class="check-bar"><span style="width:' +
        Math.round(done / list.length * 100) + '%"></span></div>' : '') +
      rows +
      '<div class="log-add"><input type="text" id="checkInput" ' +
        'placeholder="' + esc(t("check.ph")) + '" />' +
        '<div class="log-add-row"><button class="btn" type="button" id="checkAdd">' +
          esc(t("check.add")) + '</button></div></div>';
  }

  function filesHtml(card) {
    var list = card.files || [];
    var rows = list.length
      ? '<div class="file-list">' + list.map(function (f) {
          return '<div class="file-row">' +
            '<a href="' + esc(f.url) + '" target="_blank" rel="noreferrer noopener" class="file-name">' +
              esc(f.name) + '</a>' +
            '<span class="file-size">' + esc(prettySize(f.size)) + '</span>' +
            '<button class="icon-btn" type="button" data-file-del="' + f.id + '" ' +
              'aria-label="' + esc(t("file.del")) + '">✕</button>' +
            '</div>';
        }).join("") + '</div>'
      : '<p class="log-empty">' + esc(t("file.empty")) + '</p>';

    var canUpload = mcpReady() && !sync.off;
    return '<div class="log-head"><h3>' + esc(t("file.label")) + '</h3>' +
        (list.length ? '<span class="n">' + list.length + '</span>' : '') +
      '</div>' +
      '<p class="log-hint">' + esc(canUpload ? t("file.hint") : t("file.off")) + '</p>' +
      rows +
      (canUpload ? '<div class="log-add-row">' +
        '<button class="btn" type="button" id="fileAdd">' + esc(t("file.add")) + '</button>' +
        '<input type="file" id="fileUp" class="sr-only" />' +
        '</div>' : '');
  }

  function prettySize(n) {
    if (!n) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function renderChecks(cardId) {
    var host = $("checkSection");
    var card = B().cards[cardId];
    if (host && card) host.innerHTML = checksHtml(card);
  }
  function renderFiles(cardId) {
    var host = $("fileSection");
    var card = B().cards[cardId];
    if (host && card) host.innerHTML = filesHtml(card);
  }

  function addCheck(cardId, text) {
    var card = B().cards[cardId];
    if (!card || !text.trim()) return;
    card.checks.push({ id: uid("x"), text: text.trim(), done: false });
    touchCard(card);
    markTouched(); save(); render();
    renderChecks(cardId);
    var el = $("checkInput");
    if (el) el.focus();
  }

  function toggleCheck(cardId, checkId) {
    var card = B().cards[cardId];
    if (!card) return;
    card.checks.forEach(function (k) { if (k.id === checkId) k.done = !k.done; });
    touchCard(card);
    markTouched(); save(); render();
    renderChecks(cardId);
  }

  function delCheck(cardId, checkId) {
    var card = B().cards[cardId];
    if (!card) return;
    card.checks = card.checks.filter(function (k) { return k.id !== checkId; });
    touchCard(card);
    markTouched(); save(); render();
    renderChecks(cardId);
  }

  function fileToBase64(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { rej(new Error("read failed")); };
      r.readAsDataURL(file);
    });
  }

  function uploadFile(cardId, file) {
    var card = B().cards[cardId];
    if (!card) return;
    if (!mcpReady() || sync.off) { toast(t("file.off")); return; }
    if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
      toast(t("file.tooBig", { n: MAX_UPLOAD_MB }));
      return;
    }
    var btn = $("fileAdd");
    if (btn) { btn.disabled = true; btn.textContent = t("file.adding"); }

    fileToBase64(file).then(function (b64) {
      return window.claude.mcp.callTool(DRIVE, "create_file", {
        title: file.name,
        base64Content: b64,
        contentMimeType: file.type || "application/octet-stream",
        disableConversionToGoogleType: true
      });
    }).then(function (res) {
      var pl = (res && res.payload) || {};
      card.files.push({
        id: uid("f"), name: pl.title || file.name,
        url: pl.viewUrl || "", mime: pl.mimeType || file.type || "",
        size: Number(pl.fileSize) || file.size, at: Date.now()
      });
      touchCard(card);
      markTouched(); save(); render();
      renderFiles(cardId);
      toast(t("file.uploaded", { t: clip(file.name, 26) }));
    }).catch(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = t("file.add"); }
      if (syncDead(err)) { sync.off = true; renderFiles(cardId); return; }
      toast(syncErrText(err, true, DRIVE));
    });
  }

  function delFile(cardId, fileId) {
    var card = B().cards[cardId];
    if (!card) return;
    card.files = card.files.filter(function (f) { return f.id !== fileId; });
    touchCard(card);
    markTouched(); save(); render();
    renderFiles(cardId);
    // Drive exposes no delete tool, so the file itself stays put
    toast(t("file.removed"));
  }

  function logSectionHtml(card) {
    var n = logOf(card).length;
    return '<div class="log-head"><h3>' + esc(t("log.title")) + '</h3>' +
        (n ? '<span class="n">' + t("log.n", { n: n }) + '</span>' : '') +
      '</div>' +
      '<p class="log-hint">' + esc(t("log.hint")) + '</p>' +
      logListHtml(card) +
      '<div class="log-add">' +
        '<textarea id="logInput" rows="2" placeholder="' + esc(t("log.ph")) + '"></textarea>' +
        '<div class="log-add-row">' +
          '<button class="btn btn-primary" type="button" id="logAdd">' + esc(t("log.add")) + '</button>' +
          '<span class="hint">' + esc(t("log.addHint")) + '</span>' +
        '</div>' +
      '</div>';
  }

  function renderLogSection(cardId, focus) {
    var host = $("logSection");
    var card = B().cards[cardId];
    if (!host || !card) return;
    host.innerHTML = logSectionHtml(card);
    var list = host.querySelector(".log-list");
    if (list) list.scrollTop = list.scrollHeight;

  function submitLog() {
