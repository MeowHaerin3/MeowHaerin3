<title>กระดานงานของเจโน่</title>

<style>
  /* ─── tokens ─────────────────────────────────────────────── */
  :root {
    --ground: #eaeeec;
    --surface: #fbfcfc;
    --surface-2: #f1f5f3;
    --surface-3: #e3e9e6;
    --ink: #121b1a;
    --ink-2: #3b4a47;
    --muted: #66766f;
    --line: #d2dad7;
    --line-strong: #b8c4c0;

    --accent: #14655c;
    --accent-ink: #0c4b44;
    --accent-soft: #d8e9e5;
    --on-accent: #ffffff;

    --danger: #a93b2a;
    --danger-soft: #f6e2dd;
    --warn: #92620f;
    --warn-soft: #f6ead2;
    --ok: #3e7a44;
    --ok-soft: #dfeddf;

    --shadow-1: 0 1px 2px rgba(18, 27, 26, .07);
    --shadow-2: 0 1px 2px rgba(18, 27, 26, .06), 0 8px 20px -10px rgba(18, 27, 26, .28);
    --shadow-drag: 0 12px 28px -8px rgba(18, 27, 26, .35);

    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;

    --sans: "IBM Plex Sans Thai", "Noto Sans Thai",
      "Leelawadee UI", "Sarabun", "Thonburi", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  /* Font choices. Webfont CDNs are blocked, so every option is a stack of
     faces the device already has, each with Thai and Latin coverage. */
  :root[data-font="loop"] {
    --sans: "IBM Plex Sans Thai Looped", "Noto Sans Thai Looped", "Sarabun",
      "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  }
  :root[data-font="serif"] {
    --sans: "Noto Serif Thai", "Sarabun", "Charter", "Iowan Old Style",
      Georgia, "Times New Roman", serif;
  }
  :root[data-font="system"] {
    --sans: system-ui, -apple-system, "Segoe UI", "Leelawadee UI",
      "Noto Sans Thai", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-font="mono"] {
    --sans: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo,
      "Noto Sans Thai", "Leelawadee UI", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1413;
      --surface: #171f1e;
      --surface-2: #1d2726;
      --surface-3: #253130;
      --ink: #e4eae8;
      --ink-2: #b6c3bf;
      --muted: #8a9995;
      --line: #283433;
      --line-strong: #3b4a47;

      --accent: #4fb8a8;
      --accent-ink: #93ddd0;
      --accent-soft: #12302c;
      --on-accent: #06201d;

      --danger: #e08272;
      --danger-soft: #37201c;
      --warn: #dba652;
      --warn-soft: #332718;
      --ok: #82c184;
      --ok-soft: #1c2b1d;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
      --shadow-drag: 0 12px 28px -8px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0e1413;
    --surface: #171f1e;
    --surface-2: #1d2726;
    --surface-3: #253130;
    --ink: #e4eae8;
    --ink-2: #b6c3bf;
    --muted: #8a9995;
    --line: #283433;
    --line-strong: #3b4a47;
    --accent: #4fb8a8;
    --accent-ink: #93ddd0;
    --accent-soft: #12302c;
    --on-accent: #06201d;
    --danger: #e08272;
    --danger-soft: #37201c;
    --warn: #dba652;
    --warn-soft: #332718;
    --ok: #82c184;
    --ok-soft: #1c2b1d;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -10px rgba(0, 0, 0, .7);
    --shadow-drag: 0 12px 28px -8px rgba(0, 0, 0, .8);
  }

  :root[data-theme="light"] {
    --ground: #eaeeec;
    --surface: #fbfcfc;
    --surface-2: #f1f5f3;
    --surface-3: #e3e9e6;
    --ink: #121b1a;
    --ink-2: #3b4a47;
    --muted: #66766f;
    --line: #d2dad7;
    --line-strong: #b8c4c0;
    --accent: #14655c;
    --accent-ink: #0c4b44;
    --accent-soft: #d8e9e5;
    --on-accent: #ffffff;
    --danger: #a93b2a;
    --danger-soft: #f6e2dd;
    --warn: #92620f;
    --warn-soft: #f6ead2;
    --ok: #3e7a44;
    --ok-soft: #dfeddf;
    --shadow-1: 0 1px 2px rgba(18, 27, 26, .07);
    --shadow-2: 0 1px 2px rgba(18, 27, 26, .06), 0 8px 20px -10px rgba(18, 27, 26, .28);
    --shadow-drag: 0 12px 28px -8px rgba(18, 27, 26, .35);
  }

  /* ─── base ───────────────────────────────────────────────── */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button, input, textarea, select { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    gap: 0;
  }

  .wrap {
    width: 100%;
    max-width: 1280px;
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 32px);
  }

  /* ─── masthead ───────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding-block: 20px 18px;
  }

  .masthead-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand h1 {
    margin: 0;
    font-size: clamp(21px, 2.6vw, 27px);
    font-weight: 700;
    letter-spacing: -.015em;
    text-wrap: balance;
    line-height: 1.25;
  }

  .brand .stamp {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }

  .brand p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    max-width: 62ch;
  }

  .masthead-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ─── buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s, border-color .14s, color .14s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted); color: var(--ink); }
  .btn:active { transform: translateY(.5px); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .btn-primary:hover {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: var(--ground);
  }

  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }

  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: 26px; height: 26px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    transition: background .14s, color .14s;
  }
  .icon-btn:hover { background: var(--surface-3); color: var(--ink); }

  /* ─── view nav ───────────────────────────────────────────── */
  .nav {
    display: flex;
    gap: 2px;
    margin-top: 14px;
    margin-bottom: -18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav button {
    position: relative;
    padding: 7px 13px 10px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border-radius: var(--r-sm) var(--r-sm) 0 0;
  }
  .nav button::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px; bottom: 0;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
  }
  .nav button:hover { color: var(--ink); }
  .nav button[aria-current="page"] { color: var(--ink); font-weight: 650; }
  .nav button[aria-current="page"]::after { background: var(--accent); }

  .nav .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--danger);
    color: var(--surface);
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    vertical-align: 1.5px;
  }

  /* ─── summary pages ──────────────────────────────────────── */
  .page {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-bottom: 44px;
  }
  .page[hidden] { display: none; }

  .panel {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head .rule {
    width: 3px;
    align-self: stretch;
    border-radius: 2px;
    background: var(--line-strong);
    margin: -1px 3px -1px -6px;
  }
  .panel-head h2 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: -.008em;
  }
  .panel-head .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0;
  }
  .panel-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex: none;
  }

  .panel.sev-over .panel-head .rule { background: var(--danger); }
  .panel.sev-over .panel-head h2 { color: var(--danger); }
  .panel.sev-today .panel-head .rule { background: var(--warn); }
  .panel.sev-today .panel-head h2 { color: var(--warn); }
  .panel.sev-next .panel-head .rule { background: var(--accent); }
  .panel.sev-done .panel-head .rule { background: var(--ok); }
  .panel.sev-done { background: transparent; }

  .rows { display: flex; flex-direction: column; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
  }
  .rows > .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }

  .tick {
    flex: none;
    width: 17px; height: 17px;
    margin-top: 3px;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: transparent;
    font-size: 11px;
    line-height: 1;
    transition: border-color .12s, background .12s, color .12s;
  }
  .tick:hover { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .row.done-row .tick { border-color: var(--ok); background: var(--ok); color: var(--surface); }

  .row-main { flex: 1; min-width: 0; }
  .row-title {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .row.done-row .row-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  .row-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .row-meta .pri-dot {
    width: 7px; height: 7px;
    border-radius: 2px;
    background: var(--line-strong);
    flex: none;
  }
  .row-meta .pri-dot.p-high { background: var(--danger); }
  .row-meta .pri-dot.p-mid { background: var(--warn); }

  .row-when {
    flex: none;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    padding-top: 1px;
  }
  .row-when .exact {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  @media (max-width: 520px) {
    .row { flex-wrap: wrap; }
    .row-when { width: 100%; align-items: flex-start; padding-left: 28px; }
  }

  .panel-empty {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  /* group headings inside the remaining/due pages */
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 16px;
    background: var(--surface-2);
    border-top: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink-2);
  }
  .rows > .group-head:first-child { border-top: 0; }
  .group-head .n {
    margin-left: auto;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--muted);
  }
  .group-head .when {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0;
  }

  /* ─── controls row ───────────────────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
  }
  .control-group { display: flex; align-items: center; gap: 7px; }
  .control-group > span {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg {
    display: flex;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .seg button {
    padding: 4px 11px;
    border: 0;
    border-left: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
  }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: var(--surface-2); color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-weight: 600;
  }

  /* ─── 14-day load strip ──────────────────────────────────── */
  /* the chart panel opts out of clipping so the tooltip can sit above the plot */
  .panel-chart { overflow: visible; }

  .chart-wrap { padding: 16px 16px 12px; }

  .chart-caption {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chart-caption strong { font-size: 13.5px; font-weight: 600; }
  .chart-caption span { font-size: 12px; color: var(--muted); }
  @media (max-width: 620px) {
    .chart-caption { flex-direction: column; gap: 2px; }
  }

  .plot {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 78px;
    border-bottom: 1px solid var(--line);
  }

  .day {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: default;
  }
  .day .bar {
    width: 100%;
    max-width: 24px;
    background: var(--accent);
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: background .12s;
  }
  .day.empty .bar {
    background: var(--line-strong);
    height: 2px !important;
    border-radius: 0;
  }
  .day.is-today .bar { background: var(--accent-ink); }
  .day.weekend .bar { opacity: .62; }
  .day:hover .bar, .day:focus-visible .bar { background: var(--ink-2); }

  .day .cap {
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    margin-bottom: 3px;
    line-height: 1;
  }

  .axis {
    display: flex;
    gap: 2px;
    margin-top: 6px;
  }
  .axis .tick-lbl {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    line-height: 1.3;
  }
  .axis .tick-lbl.is-today { color: var(--accent-ink); font-weight: 600; }
  .axis .tick-lbl small {
    display: block;
    font-family: var(--sans);
    font-size: 9.5px;
    letter-spacing: .02em;
  }

  .tip {
    position: absolute;
    z-index: 60;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--ground);
    border-radius: var(--r-md);
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow-2);
    max-width: 220px;
  }
  .tip[hidden] { display: none; }
  .tip b { font-weight: 600; }
  .tip .t-list { color: var(--line-strong); white-space: normal; }

  /* ─── pulse strip: the "what's on me right now" answer ───── */
  .pulse-band {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-block: 16px;
  }

  .pulse {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 620px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 11px 13px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-2);
    text-align: left;
    cursor: pointer;
    transition: border-color .14s, background .14s, box-shadow .14s;
    overflow: hidden;
  }
  .tile::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--muted);
    opacity: .45;
  }
  .tile:hover { border-color: var(--line-strong); }
  .tile[aria-pressed="true"] {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: var(--shadow-1);
  }
  .tile[aria-pressed="true"]::before { opacity: 1; }

  .tile .n {
    font-family: var(--mono);
    font-size: 27px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .tile .lbl {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .tile.t-over::before { background: var(--danger); }
  .tile.t-over .n { color: var(--danger); }
  .tile.t-today::before { background: var(--warn); }
  .tile.t-today .n { color: var(--warn); }
  .tile.t-week::before { background: var(--accent); }
  .tile.t-open::before { background: var(--line-strong); }

  .tile .zero { color: var(--muted); }

  .pulse-note {
    margin: 10px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .pulse-note .dot {
    flex: none;
    width: 6px; height: 6px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--ok);
  }

  /* ─── toolbar ────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-block: 12px;
  }

  .search {
    position: relative;
    flex: 1 1 220px;
    min-width: 180px;
    max-width: 340px;
  }
  .search input {
    width: 100%;
    padding: 7px 30px 7px 30px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: 13.5px;
  }
  .search input::placeholder { color: var(--muted); }
  .search .mag {
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: grid;
  }
  .search .clr {
    position: absolute;
    right: 5px; top: 50%;
    transform: translateY(-50%);
  }

  .spacer { flex: 1 1 auto; }

    var s = STR[view.lang][key];
    if (s === undefined) s = STR.th[key];
    if (s === undefined) return key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {

  function isoOf(d) {

  }
  function todayIso() { return isoOf(new Date()); }

    var d = new Date();

    if (!iso) return null;
    var p = iso.split("-").map(Number);
    if (p.length !== 3 || !p[0]) return null;
    var due = new Date(p[0], p[1] - 1, p[2]);
    var now = new Date();
    due.setHours(0, 0, 0, 0);
    now.setHours(0, 0, 0, 0);
    return Math.round((due - now) / 86400000);
  }
  function prettyDate(iso) {
    var p = iso.split("-").map(Number);

  }
  function exactDate(iso) {
    var p = iso.split("-").map(Number);

  }

    var n = daysUntil(iso);

    if (n === -1) return { text: t("dueL.over1"), cls: "due-over" };
    if (n === 0) return { text: t("dueL.today"), cls: "due-today" };
    if (n === 1) return { text: t("dueL.tmr"), cls: "due-soon" };
    if (n <= 7) return { text: t("dueL.inN", { n: n }), cls: "due-soon" };

  function seed() {

      return c.id;
    }

    var cols = [
      { id: uid("c"), title: S.cols[0], done: false, cards: [ids[0], ids[1], ids[2]] },
      { id: uid("c"), title: S.cols[1], done: false, cards: [ids[3]] },
      { id: uid("c"), title: S.cols[2], done: false, cards: [ids[4]] },
      { id: uid("c"), title: S.cols[3], done: true, cards: [ids[5]] }
    ];
    cards[ids[5]].doneAt = Date.now();

    cards[ids[3]].log = S.log.map(function (text, i) {

      tags: [], log: [], created: Date.now(), doneAt: col.done ? Date.now() : 0
    };
    state.cards[card.id] = card;
    col.cards.push(card.id);
    commit();
  }

  function place(cardId, toColId, resolveIndex) {
    var from = colOf(cardId);
    var to = state.columns[colIndex(toColId)];
    if (!from || !to) return;
    from.cards.splice(from.cards.indexOf(cardId), 1);
    var index = resolveIndex(to);
    if (index === null || index < 0 || index > to.cards.length) index = to.cards.length;
    to.cards.splice(index, 0, cardId);
    var card = state.cards[cardId];
    if (to.done) { if (!card.doneAt) card.doneAt = Date.now(); }
    else card.doneAt = 0;
    commit();
  }

  function moveCard(cardId, toColId, index) {
    place(cardId, toColId, function () { return index; });
  }

  /* Drops anchor to the card the drop line sits above, so the position is
     right even when a filter hides some of the column's cards. */
  function dropBefore(cardId, toColId, anchorId) {
    place(cardId, toColId, function (to) {
      return anchorId ? to.cards.indexOf(anchorId) : to.cards.length;
    });
  }

  function nudge(cardId, dir) {
    var from = colOf(cardId);
    if (!from) return;
    var target = state.columns[colIndex(from.id) + dir];
    if (!target) return;
    moveCard(cardId, target.id, target.cards.length);
  }

  function doneColumn() {
    for (var i = state.columns.length - 1; i >= 0; i--) {
      if (state.columns[i].done) return state.columns[i];
    }
    return null;
  }

  /* Tick a task off from any of the summary views. */
  function completeCard(cardId) {
    var card = state.cards[cardId];
    var from = colOf(cardId);
    if (!card || !from) return;

    if (from.done) { openEditor(cardId); return; }

    var target = doneColumn();
    if (!target) { toast(t("toast.noDoneCol")); return; }

    var back = { colId: from.id, index: from.cards.indexOf(cardId) };
    moveCard(cardId, target.id, target.cards.length);
    toast(t("toast.closed", { t: clip(card.title, 27) }), t("toast.undo"), function () {
      moveCard(cardId, back.colId, back.index);
    });
  }

  function deleteCard(cardId) {
    var col = colOf(cardId);
    if (!col) return;
    var idx = col.cards.indexOf(cardId);
    undoBuf = { card: state.cards[cardId], colId: col.id, index: idx };
    col.cards.splice(idx, 1);
    delete state.cards[cardId];
    commit();
    toast(t("toast.deleted", { t: clip(undoBuf.card.title, 29) }), t("toast.undo"), function () {
      if (!undoBuf) return;
      var c = state.columns[colIndex(undoBuf.colId)] || state.columns[0];
      state.cards[undoBuf.card.id] = undoBuf.card;
      c.cards.splice(Math.min(undoBuf.index, c.cards.length), 0, undoBuf.card.id);
      undoBuf = null;
      commit();
    });
  }

  /* ═══ the activity log on a task ════════════════════════════ */
  function logOf(card) { return card.log || (card.log = []); }

  function addLogEntry(cardId, text) {
    var card = state.cards[cardId];
    if (!card || !text.trim()) return;
    logOf(card).push({ id: uid("g"), text: text.trim(), at: Date.now() });
    markTouched();
    save();
    render();
    renderSync();
    renderLogSection(cardId, true);
  }

  function deleteLogEntry(cardId, entryId) {
    var card = state.cards[cardId];
    if (!card) return;
    var log = logOf(card);
    var i = -1;
    log.forEach(function (g, k) { if (g.id === entryId) i = k; });
    if (i === -1) return;

    var removed = log.splice(i, 1)[0];
    markTouched();
    save();
    render();
    renderSync();
    renderLogSection(cardId);
    toast(t("toast.logDeleted"), t("toast.undo"), function () {
      var c = state.cards[cardId];
      if (!c) return;
      logOf(c).splice(Math.min(i, logOf(c).length), 0, removed);
      save();
      render();
      if (editing && editing.id === cardId) renderLogSection(cardId);
    });
  }

  /* Entries group under a date heading so a run of client requests on the
     same day reads as one conversation. */
  function logListHtml(card) {
    var log = logOf(card).slice().sort(function (a, b) { return a.at - b.at; });
    if (!log.length) return '<p class="log-empty">' + esc(t("log.empty")) + '</p>';

    var out = "";
    var lastDay = "";
    log.forEach(function (g) {
      var day = isoOf(new Date(g.at));
      if (day !== lastDay) {
        lastDay = day;
        var n = daysUntil(day);
        var head = n === 0 ? t("log.today") : n === -1 ? t("log.yesterday") : exactDate(day);
        out += '<div class="log-day">' + esc(head) + '</div>';
      }
      out += '<div class="log-entry">' +
        '<p class="log-text">' + esc(g.text) + '</p>' +
        '<span class="log-time">' + esc(localeTime(g.at)) + '</span>' +
        '<button class="icon-btn log-del" type="button" data-log-del="' + g.id + '" ' +
          'aria-label="' + esc(t("log.del")) + '">✕</button>' +
        '</div>';
    });
    return '<div class="log-list">' + out + '</div>';
  }

  function logSectionHtml(card) {
    var n = logOf(card).length;
    return '<div class="log-head"><h3>' + esc(t("log.title")) + '</h3>' +
        (n ? '<span class="n">' + t("log.n", { n: n }) + '</span>' : '') +
      '</div>' +
      '<p class="log-hint">' + esc(t("log.hint")) + '</p>' +
      logListHtml(card) +
      '<div class="log-add">' +
        '<textarea id="logInput" rows="2" placeholder="' + esc(t("log.ph")) + '"></textarea>' +
        '<div class="log-add-row">' +
          '<button class="btn btn-primary" type="button" id="logAdd">' + esc(t("log.add")) + '</button>' +
          '<span class="hint">' + esc(t("log.addHint")) + '</span>' +
        '</div>' +
      '</div>';
  }

  function renderLogSection(cardId, focus) {
    var host = $("logSection");
    var card = state.cards[cardId];
    if (!host || !card) return;
    host.innerHTML = logSectionHtml(card);
    var list = host.querySelector(".log-list");
    if (list) list.scrollTop = list.scrollHeight;
    if (focus) {
      var input = $("logInput");
      if (input) input.focus();
    }
  }

  function submitLog() {
    if (!editing) return;
    var input = $("logInput");
    if (!input || !input.value.trim()) return;
    addLogEntry(editing.id, input.value);
  }

  /* ═══ Google Drive sync ═════════════════════════════════════
     Drive has create_file but no update_file, so every push writes a
     new dated file and a pull reads the newest one back. Pull runs on
     open; push is always a button press. */
  var DRIVE = "Google Drive";
  var SYNC_PREFIX = "todo-board-sync-";
  var sync = { busy: false, checked: false, off: false, err: "", driveAt: 0 };

  function mcpReady() { return !!(window.claude && window.claude.mcp); }

  function b64decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* Lifecycle codes mean MCP will never work in this view — hide the
     feature rather than nagging about it. */
  function syncDead(err) {
    var c = err && err.code;
    return c === "not_granted" || c === "capability_disabled" || c === "capability_removed";
  }

  /* Each code has a different fix, so each gets its own message. */
  function syncErrText(err, isWrite) {
    var c = err && err.code;
    if (c === "needs_reauth") return t("sync.err.reauth");
    if (c === "server_not_connected") return t("sync.err.notConnected");
    if (c === "selection_required") return t("sync.err.selection");
    if (c === "blocked_by_policy" || c === "approval_required") return t("sync.err.policy");
    if (c === "server_unavailable") {
      // for a write this is ambiguous: the file may or may not exist now
      return isWrite ? t("sync.err.writeUnknown") : t("sync.err.unavailable");
    }
    if (c === "tool_error") return t("sync.err.tool", { m: clip(String(err.message || ""), 120) });
    return t("sync.err.other");
  }

  function driveNewest() {
    return window.claude.mcp.callTool(DRIVE, "search_files", {
      query: "title contains '" + SYNC_PREFIX + "' and mimeType = 'application/json'",
      pageSize: 25,
      excludeContentSnippets: true
    }, { cache: false }).then(function (res) {
      // an empty search resolves to {} rather than {files: []}
      var files = (res && res.payload && res.payload.files) || [];
      if (!files.length) return null;
      return files.slice().sort(function (a, b) {
        return String(b.createdTime || "").localeCompare(String(a.createdTime || ""));
      })[0];
    });
  }

  function driveLoad(file) {
    return window.claude.mcp.callTool(DRIVE, "download_file_content", {
      fileId: file.id
    }, { cache: false }).then(function (res) {
      var b64 = res && res.payload && res.payload.content;
      if (!b64) return null;
      var raw;
      try { raw = JSON.parse(b64decode(b64)); } catch (e) { return null; }
      var clean = sanitize(raw);
      if (!clean) return null;
      return {
        state: clean,
        savedAt: typeof raw.savedAt === "number"
          ? raw.savedAt
          : (Date.parse(file.createdTime) || 0)
      };
    });
  }

  function applyRemote(loaded) {
    state = loaded.state;
    state.syncedAt = loaded.savedAt;
    state.touchedAt = loaded.savedAt;
    state.seenDriveAt = loaded.savedAt;
    sync.driveAt = loaded.savedAt;
    view.filter = "all";
    save();
    render();
    renderSync();
    toast(t("sync.pulled", { n: Object.keys(state.cards).length }));
  }

  function askSyncConflict(loaded) {
    var dn = Object.keys(loaded.state.cards).length;
    var ln = Object.keys(state.cards).length;
    $("sheet").innerHTML =
      '<h2 id="sheetTitle">' + esc(t("sync.conflict.title")) + '</h2>' +
      '<p class="sub"></p>' +
      '<p style="margin:0;color:var(--ink-2);font-size:14px;">' +
        esc(t("sync.conflict.body", {
          dn: dn, ln: ln,
          dd: localeDate(loaded.savedAt, { day: "numeric", month: "short" }) + " " + localeTime(loaded.savedAt)
        })) + '</p>' +
      '<div class="sheet-foot"><span class="spacer"></span>' +
        '<button class="btn" type="button" id="syncKeepLocal">' +
          esc(t("sync.conflict.keepLocal")) + '</button>' +
        '<button class="btn btn-primary" type="button" id="syncUseDrive">' +
          esc(t("sync.conflict.useDrive")) + '</button>' +
      '</div>';
    $("backdrop").hidden = false;
    $("syncUseDrive").onclick = function () { closeSheet(); applyRemote(loaded); };
    $("syncKeepLocal").onclick = function () {
      closeSheet();
      // remember this Drive version so the same copy stops re-asking
      state.seenDriveAt = loaded.savedAt;
      sync.driveAt = loaded.savedAt;
      save();
      renderSync();
    };
    window.setTimeout(function () { $("syncKeepLocal").focus(); }, 20);
  }

  function drivePull(manual) {
    if (!mcpReady() || sync.off || sync.busy) return;
    sync.busy = true;
    sync.err = "";
    renderSync();

    driveNewest().then(function (file) {
      if (!file) {
        sync.busy = false; sync.checked = true; renderSync();
        if (manual) toast(t("sync.none"));
        return;
      }
      return driveLoad(file).then(function (loaded) {
        sync.busy = false;
        sync.checked = true;
        if (!loaded) {
          sync.err = t("sync.err.badFile");
          renderSync();
          return;
        }
        sync.driveAt = loaded.savedAt;
        var known = Math.max(state.syncedAt || 0, state.seenDriveAt || 0);
        if (loaded.savedAt <= known) {
          renderSync();
          if (manual) toast(t("sync.upToDate"));
          return;
        }
        // untouched since the last push → safe to take Drive's copy outright
        if ((state.touchedAt || 0) <= (state.syncedAt || 0)) applyRemote(loaded);
        else askSyncConflict(loaded);
      });
    }).catch(function (err) {
      sync.busy = false;
      sync.checked = true;
      if (syncDead(err)) sync.off = true;
      else sync.err = syncErrText(err, false);
      renderSync();
      if (manual && sync.err) toast(sync.err);
    });
  }

  function drivePush() {
    if (!mcpReady() || sync.off || sync.busy) return;
    sync.busy = true;
    sync.err = "";
    renderSync();

    var now = new Date();
    var name = SYNC_PREFIX + isoOf(now) + "-" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") + ".json";
    var savedAt = Date.now();

    window.claude.mcp.callTool(DRIVE, "create_file", {
      title: name,
      textContent: JSON.stringify({
        v: 2, savedAt: savedAt, columns: state.columns, cards: state.cards
      }),
      contentMimeType: "application/json",
      disableConversionToGoogleType: true
    }).then(function () {
      state.syncedAt = savedAt;
      state.seenDriveAt = savedAt;
      sync.driveAt = savedAt;
      sync.busy = false;
      save();
      renderSync();
      toast(t("sync.pushed"));
    }).catch(function (err) {
      sync.busy = false;
      if (syncDead(err)) sync.off = true;
      else sync.err = syncErrText(err, true);
      renderSync();
      if (sync.err) toast(sync.err);
    });
  }

  function syncBoxHtml() {
    if (!mcpReady() || sync.off) {
      return '<div class="sync-box"><p class="sync-state is-off">' +
        '<span class="dot"></span><span>' + esc(t("sync.off")) + '</span></p></div>';
    }

    var dirty = (state.touchedAt || 0) > (state.syncedAt || 0);
    var line;
    if (sync.busy) line = t("sync.checking");
    else if (!state.syncedAt) line = t("sync.never");
    else {
      line = t("sync.last", {
        d: localeDate(state.syncedAt, { day: "numeric", month: "short" }) + " " + localeTime(state.syncedAt)
      });
      if (dirty) line += " · " + t("sync.dirty");
    }

    return '<div class="sync-box">' +
      '<p class="sync-state' + (dirty ? " is-stale" : "") + '">' +
        '<span class="dot"></span><span>' + esc(line) + '</span></p>' +
      (sync.err ? '<p class="sync-err">' + esc(sync.err) + '</p>' : '') +
      '<div class="sync-row">' +
        '<button class="btn btn-primary" type="button" id="syncPush"' +
          (sync.busy ? " disabled" : "") + '>' +
          esc(sync.busy ? t("sync.pushing") : t("sync.push")) + '</button>' +
        '<button class="btn" type="button" id="syncPull"' +
          (sync.busy ? " disabled" : "") + '>' + esc(t("sync.pull")) + '</button>' +
      '</div>' +
      '<p class="sync-note">' + esc(t("sync.autoNote")) + '</p>' +
      '<p class="sync-note">' + esc(t("sync.note")) + '</p>' +
      '</div>';
  }

  function renderSync() {
    var btn = $("btnPush");
    if (btn) {
      var show = mcpReady() && !sync.off;
      btn.hidden = !show;
      btn.disabled = sync.busy;
      btn.textContent = sync.busy ? t("sync.pushing") : t("sync.push");
    }
    var box = $("syncBox");
    if (box) box.innerHTML = syncBoxHtml();
  }

  /* ═══ render: pulse strip ═══════════════════════════════════ */
  function renderPulse() {
    var cards = openCards();
    var over = 0, today = 0, week = 0;
    cards.forEach(function (c) {
      var n = daysUntil(c.due);
      if (n === null) return;
      if (n < 0) over++;
      else if (n === 0) today++;
      if (n >= 0 && n <= 7) week++;
    });

    var tiles = [
      { k: "overdue", cls: "t-over", n: over, lbl: t("tile.overdue") },
      { k: "today", cls: "t-today", n: today, lbl: t("tile.today") },
      { k: "week", cls: "t-week", n: week, lbl: t("tile.week") },
      { k: "all", cls: "t-open", n: cards.length, lbl: t("tile.open") }
    ];

    $("pulse").innerHTML = tiles.map(function (x) {
      var on = view.filter === x.k;
      return '<button type="button" class="tile ' + x.cls + '" data-filter="' + x.k +
        '" aria-pressed="' + on + '">' +
        '<span class="n' + (x.n === 0 ? " zero" : "") + '">' + x.n + '</span>' +
        '<span class="lbl">' + esc(x.lbl) + '</span></button>';
    }).join("");

    var doneToday = 0;
    var start = new Date(); start.setHours(0, 0, 0, 0);
    Object.keys(state.cards).forEach(function (id) {
      if (state.cards[id].doneAt >= start.getTime()) doneToday++;
    });

    var tail = doneToday ? t("note.tail", { n: doneToday }) : "";
    var hue = "var(--ok)";
    var text;
    if (over > 0) {
      hue = "var(--danger)";
      text = t("note.over", { n: over }) + tail;
    } else if (today > 0) {
      hue = "var(--warn)";
      text = t("note.today", { n: today }) + tail;
    } else {
      text = t("note.clear") + tail;
    }
    $("pulseNote").innerHTML =
      '<span class="dot" style="background:' + hue + '"></span><span>' + esc(text) + '</span>';
  }

  /* ═══ render: card ══════════════════════════════════════════ */
  function priLabel(p) { return t("pri." + p); }

  var ICON_LOG = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" ' +
    'stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="1.4" y="2.1" width="9.2" height="6.1" rx="1.7" />' +
    '<path d="M4.2 8.2v2.3l2.5-2.3" /></svg>';

  function logChip(card) {
    var n = logOf(card).length;
    if (!n) return "";
    return '<span class="chip log-count' + (n >= 3 ? " hot" : "") + '" ' +
      'title="' + esc(t("log.count", { n: n })) + '">' + ICON_LOG + n + '</span>';
  }

  function cardHtml(card, col, ci) {
    var chips = "";
    if (card.due) {
      var d = dueLabel(card.due);
      chips += '<span class="chip due ' + d.cls + '">' + esc(d.text) + '</span>';
    }
    if (card.pri !== "low" && !col.done) {
      chips += '<span class="chip">' + esc(priLabel(card.pri)) + '</span>';
    }
    chips += logChip(card);
    card.tags.forEach(function (x) {
      chips += '<span class="chip tag">' + esc(x) + '</span>';
    });
    if (card.note && !chips) {
      chips += '<span class="chip note-flag" title="' + esc(t("card.noteFlag")) + '">···</span>';
    }

    var atFirst = ci === 0;
    var atLast = ci === state.columns.length - 1;

    return '<article class="card p-' + card.pri + (col.done ? " is-done" : "") +
      '" draggable="true" data-card="' + card.id + '" tabindex="0" ' +
      'aria-label="' + esc(t("card.aria", { t: card.title })) + '">' +
      '<p class="card-title">' + esc(card.title) + '</p>' +
      (card.note ? '<p class="card-note">' + esc(card.note) + '</p>' : '') +
      '<div class="card-meta">' + chips + '</div>' +
      '<div class="card-move">' +
        '<button type="button" data-nudge="-1" data-card="' + card.id + '"' +
          (atFirst ? " disabled" : "") + ' aria-label="' + esc(t("card.left")) + '">←</button>' +
        '<button type="button" data-nudge="1" data-card="' + card.id + '"' +
          (atLast ? " disabled" : "") + ' aria-label="' + esc(t("card.right")) + '">→</button>' +
      '</div></article>';
  }

  /* ═══ render: shared task row ═══════════════════════════════ */
  function rowHtml(card, opts) {
    opts = opts || {};
    var col = colOf(card.id);
    var isDone = col && col.done;

    var meta = '<span class="pri-dot p-' + card.pri + '" title="' +
      esc(t("pri.aria", { t: priLabel(card.pri) })) + '"></span>';
    if (opts.showColumn !== false && col) meta += '<span>' + esc(col.title) + '</span>';
    if (card.note) meta += '<span>· ' + esc(clip(card.note.split("\n")[0], 55)) + '</span>';
    meta += logChip(card);
    card.tags.forEach(function (x) { meta += '<span class="chip tag">' + esc(x) + '</span>'; });

    var when = "";
    if (card.due) {
      var d = dueLabel(card.due);
      when = '<span class="chip due ' + d.cls + '">' + esc(d.text) + '</span>' +
        (opts.showExact === false ? "" : '<span class="exact">' + esc(exactDate(card.due)) + '</span>');
    } else if (opts.showExact !== false) {
      when = '<span class="exact">' + esc(t("dueL.none")) + '</span>';
    }

    return '<div class="row' + (isDone ? " done-row" : "") + '" data-card="' + card.id + '" ' +
      'tabindex="0" aria-label="' + esc(card.title) + '">' +
      '<button class="tick" type="button" data-complete="' + card.id + '" ' +
        'aria-label="' + esc(isDone ? t("row.reopen") : t("row.complete")) + '">✓</button>' +
      '<div class="row-main">' +
        '<p class="row-title">' + esc(card.title) + '</p>' +
        '<div class="row-meta">' + meta + '</div>' +
      '</div>' +
      (when ? '<div class="row-when">' + when + '</div>' : '') +
      '</div>';
  }

  function panelHtml(opts) {
    var body = opts.cards && opts.cards.length
      ? '<div class="rows">' + opts.cards.map(function (c) {
          return rowHtml(c, opts.rowOpts);
        }).join("") + '</div>'
      : '<p class="panel-empty">' + esc(opts.empty || t("panel.empty")) + '</p>';

    return '<section class="panel' + (opts.sev ? " sev-" + opts.sev : "") + '">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(opts.title) + '</h2>' +
        (opts.sub ? '<p class="sub">' + esc(opts.sub) + '</p>' : '') +
        '<span class="n">' + t("panel.count", { n: opts.cards ? opts.cards.length : 0 }) + '</span>' +
      '</div>' + (opts.extra || "") + body + '</section>';
  }

  /* ═══ selectors used by the summary pages ═══════════════════ */
  var PRI_ORDER = { high: 0, mid: 1, low: 2 };

  function openMatching() { return openCards().filter(matches); }

  function byBucket(cards, test) {
    return cards.filter(function (c) { return test(daysUntil(c.due), c); });
  }

  function dueRank(c) {
    var n = daysUntil(c.due);
    return n === null ? 1e6 : n;
  }

  function sortCards(list, mode) {
    var out = list.slice();
    if (mode === "pri") {
      out.sort(function (a, b) {
        var d = PRI_ORDER[a.pri] - PRI_ORDER[b.pri];
        return d ? d : dueRank(a) - dueRank(b);
      });
    } else if (mode === "new") {
      out.sort(function (a, b) { return b.created - a.created; });
    } else {
      out.sort(function (a, b) {
        var d = dueRank(a) - dueRank(b);
        return d ? d : PRI_ORDER[a.pri] - PRI_ORDER[b.pri];
      });
    }
    return out;
  }

  /* ═══ page: today ═══════════════════════════════════════════ */
  function renderToday() {
    var cards = openMatching();
    var overdue = sortCards(byBucket(cards, function (n) { return n !== null && n < 0; }), "due");
    var today = sortCards(byBucket(cards, function (n) { return n === 0; }), "pri");
    var tomorrow = sortCards(byBucket(cards, function (n) { return n === 1; }), "pri");
    var rotting = sortCards(cards.filter(function (c) {
      return !c.due && c.pri !== "low";
    }), "pri");

    var start = new Date(); start.setHours(0, 0, 0, 0);
    var closed = Object.keys(state.cards)
      .map(function (id) { return state.cards[id]; })
      .filter(function (c) { return c.doneAt >= start.getTime(); })
      .sort(function (a, b) { return b.doneAt - a.doneAt; });

    var html = "";

    if (overdue.length) {
      html += panelHtml({
        sev: "over", title: t("today.overdue.title"), sub: t("today.overdue.sub"),
        cards: overdue
      });
    }

    html += panelHtml({
      sev: "today", title: t("today.due.title"),
      sub: localeDate(Date.now(), { weekday: "long", day: "numeric", month: "long" }),
      cards: today,
      empty: overdue.length ? t("today.due.emptyA") : t("today.due.emptyB")
    });

    if (tomorrow.length) {
      html += panelHtml({
        sev: "next", title: t("today.tomorrow.title"), sub: t("today.tomorrow.sub"),
        cards: tomorrow
      });
    }

    if (rotting.length) {
      html += panelHtml({
        title: t("today.rot.title"), sub: t("today.rot.sub"),
        cards: rotting, rowOpts: { showExact: false }
      });
    }

    html += panelHtml({
      sev: "done", title: t("today.closed.title"), cards: closed,
      empty: t("today.closed.empty"), rowOpts: { showExact: false }
    });

    return html;
  }

  /* ═══ page: remaining ═══════════════════════════════════════ */
  function renderRemain() {
    var cards = openMatching();

    var groups = [];
    if (view.groupBy === "col") {
      state.columns.forEach(function (col) {
        if (col.done) return;
        var inCol = cards.filter(function (c) { return colOf(c.id) === col; });
        if (inCol.length) groups.push({ label: col.title, cards: inCol });
      });
    } else if (view.groupBy === "pri") {
      ["high", "mid", "low"].forEach(function (p) {
        var inPri = cards.filter(function (c) { return c.pri === p; });
        if (inPri.length) groups.push({ label: priLabel(p), cards: inPri });
      });
    } else {
      var byTag = {};
      var untagged = [];
      cards.forEach(function (c) {
        if (!c.tags.length) { untagged.push(c); return; }
        c.tags.forEach(function (x) { (byTag[x] = byTag[x] || []).push(c); });
      });
      Object.keys(byTag).sort().forEach(function (x) {
        groups.push({ label: x, cards: byTag[x] });
      });
      if (untagged.length) groups.push({ label: t("group.untagged"), cards: untagged });
    }

    var controls =
      '<div class="controls">' +
        '<div class="control-group"><span>' + esc(t("remain.groupLabel")) + '</span><div class="seg">' +
          seg("group", "col", t("group.col")) + seg("group", "pri", t("group.pri")) +
          seg("group", "tag", t("group.tag")) +
        '</div></div>' +
        '<div class="control-group"><span>' + esc(t("remain.sortLabel")) + '</span><div class="seg">' +
          seg("sort", "due", t("sort.due")) + seg("sort", "pri", t("sort.pri")) +
          seg("sort", "new", t("sort.new")) +
        '</div></div>' +
      '</div>';

    var body;
    if (!groups.length) {
      body = '<p class="panel-empty">' +
        esc(view.query || view.filter !== "all" ? t("remain.noMatch") : t("remain.none")) + '</p>';
    } else {
      body = '<div class="rows">' + groups.map(function (g) {
        return '<div class="group-head">' + esc(g.label) +
          '<span class="n">' + g.cards.length + '</span></div>' +
          sortCards(g.cards, view.sortBy).map(function (c) {
            return rowHtml(c, { showColumn: view.groupBy !== "col" });
          }).join("");
      }).join("") + '</div>';
    }

    return '<section class="panel">' +
      '<div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("remain.title")) + '</h2>' +
        '<p class="sub">' + esc(t("remain.sub")) + '</p>' +
        '<span class="n">' + t("panel.count", { n: cards.length }) + '</span>' +
      '</div>' + controls + body + '</section>';
  }

  function seg(kind, value, label) {
    var on = (kind === "group" ? view.groupBy : view.sortBy) === value;
    return '<button type="button" data-' + kind + '="' + value + '" aria-pressed="' + on + '">' +
      esc(label) + '</button>';
  }

  /* ═══ page: due dates ═══════════════════════════════════════ */
  var DUE_BUCKETS = [
    { key: "over", when: "bucket.overWhen", test: function (n) { return n < 0; } },
    { key: "today", when: "", test: function (n) { return n === 0; } },
    { key: "tmr", when: "", test: function (n) { return n === 1; } },
    { key: "week", when: "", test: function (n) { return n >= 2 && n <= 7; } },
    { key: "month", when: "", test: function (n) { return n >= 8 && n <= 30; } },
    { key: "later", when: "", test: function (n) { return n > 30; } }
  ];

  function renderDue() {
    var cards = openMatching();
    var dated = cards.filter(function (c) { return c.due; });
    var undated = cards.filter(function (c) { return !c.due; });

    var body = "";
    DUE_BUCKETS.forEach(function (b) {
      var inB = sortCards(dated.filter(function (c) { return b.test(daysUntil(c.due)); }), "due");
      if (!inB.length) return;
      body += '<div class="group-head">' + esc(t("bucket." + b.key)) +
        (b.when ? '<span class="when">' + esc(t(b.when)) + '</span>' : "") +
        '<span class="n">' + inB.length + '</span></div>' +
        inB.map(function (c) { return rowHtml(c); }).join("");
    });

    if (undated.length) {
      body += '<div class="group-head">' + esc(t("bucket.undated")) +
        '<span class="when">' + esc(t("bucket.undatedWhen")) + '</span>' +
        '<span class="n">' + undated.length + '</span></div>' +
        sortCards(undated, "pri").map(function (c) {
          return rowHtml(c, { showExact: false });
        }).join("");
    }

    var list = body
      ? '<div class="rows">' + body + '</div>'
      : '<p class="panel-empty">' + esc(t("due.noMatch")) + '</p>';

    return loadStripHtml(dated) +
      '<section class="panel">' +
        '<div class="panel-head"><span class="rule"></span>' +
          '<h2>' + esc(t("due.title")) + '</h2>' +
          '<p class="sub">' + esc(t("due.sub")) + '</p>' +
          '<span class="n">' + t("panel.count", { n: cards.length }) + '</span>' +
        '</div>' + list +
      '</section>';
  }

  /* 14-day load strip: one series (tasks due per day), single hue,
     today's column emphasized. The agenda list below is its table view. */
  var DAYS_AHEAD = 14;

  function loadStripHtml(dated) {
    var days = [];
    var max = 0;
    for (var i = 0; i < DAYS_AHEAD; i++) {
      var iso = shiftIso(i);
      var due = dated.filter(function (c) { return c.due === iso; });
      var p = iso.split("-").map(Number);
      var dow = new Date(p[0], p[1] - 1, p[2]).getDay();
      days.push({ iso: iso, day: p[2], dow: dow, cards: due });
      if (due.length > max) max = due.length;
    }

    if (!max) {
      return '<section class="panel"><div class="panel-head"><span class="rule"></span>' +
        '<h2>' + esc(t("chart.title")) + '</h2></div>' +
        '<p class="panel-empty">' + esc(t("chart.empty")) + '</p></section>';
    }

    // Label only today and the busiest day — never a value on every bar.
    var peak = -1;
    days.forEach(function (d, i) { if (d.cards.length === max && peak === -1) peak = i; });

    var bars = days.map(function (d, i) {
      // 56px of plot leaves room for the cap label inside the 78px band
      var h = d.cards.length ? Math.max(6, Math.round(d.cards.length / max * 56)) : 0;
      var label = (i === 0 || i === peak) && d.cards.length
        ? '<span class="cap">' + d.cards.length + '</span>' : "";
      return '<button class="day' + (d.cards.length ? "" : " empty") +
        (i === 0 ? " is-today" : "") +
        (d.dow === 0 || d.dow === 6 ? " weekend" : "") +
        '" type="button" data-day="' + d.iso + '" ' +
        'aria-label="' + esc(t("chart.dayAria", { d: exactDate(d.iso), n: d.cards.length })) + '">' +
        label + '<span class="bar" style="height:' + h + 'px"></span></button>';
    }).join("");

    var axis = days.map(function (d, i) {
      return '<span class="tick-lbl' + (i === 0 ? " is-today" : "") + '">' + d.day +
        '<small>' + esc(i === 0 ? t("chart.today") : L().dow[d.dow]) + '</small></span>';
    }).join("");

    var sub = max === 1
      ? t("chart.spread")
      : t("chart.peak", { d: exactDate(days[peak].iso), n: max });

    return '<section class="panel panel-chart">' +
      '<div class="chart-wrap">' +
        '<div class="chart-caption"><strong>' + esc(t("chart.title")) + '</strong>' +
          '<span>' + esc(sub) + '</span></div>' +
        '<div class="plot" id="plot">' + bars + '<div class="tip" id="tip" hidden></div></div>' +
        '<div class="axis">' + axis + '</div>' +
      '</div></section>';
  }

  /* ═══ render: board ═════════════════════════════════════════ */
  function sizeBoard() {
    var scroller = document.querySelector(".board-scroll");
    if (!scroller) return;
    var top = scroller.getBoundingClientRect().top + window.scrollY;
    document.documentElement.style.setProperty(
      "--col-max", Math.max(240, window.innerHeight - top - 34) + "px");
  }

    var overdue = openCards().filter(function (c) {
      var n = daysUntil(c.due);

      var on = view.page === k;

    $("mastTitle").textContent = t("mast.title");

    $("btnReset").textContent = t("btn.reset");

      weekday: "short", day: "numeric", month: "short"
    });

    renderSync();

  function render() {
    renderPulse();
    renderNav();

    var onBoard = view.page === "board";
    $("boardScroll").hidden = !onBoard;
    $("page").hidden = onBoard;

    if (!onBoard) {
      $("page").innerHTML =
        view.page === "today" ? renderToday() :
        view.page === "remain" ? renderRemain() : renderDue();
      $("blankSlot").innerHTML = "";
      renderFilterPill();
      return;
    }

    var filtering = view.filter !== "all" || view.query.trim() !== "";
    var html = "";

    state.columns.forEach(function (col, ci) {
      var visible = col.cards
        .map(function (id) { return state.cards[id]; })
        .filter(function (c) { return c && matches(c); });

      html += '<section class="col' + (col.done ? " is-done" : "") + '" data-col="' + col.id + '">' +
        '<div class="col-head">' +
          '<span class="swatch"></span>' +
          '<h2 title="' + esc(col.title) + '">' + esc(col.title) + '</h2>' +
          '<span class="count">' + (filtering ? visible.length + "/" + col.cards.length : col.cards.length) + '</span>' +
          '<div class="col-menu">' +
            '<button class="icon-btn" type="button" data-menu="' + col.id + '" ' +
              'aria-label="' + esc(t("col.menuAria", { t: col.title })) + '">⋯</button>' +
            (view.menuFor === col.id ? menuHtml(col) : "") +
          '</div>' +
        '</div>' +
        '<div class="col-body" data-drop="' + col.id + '">';

      if (visible.length) {
        visible.forEach(function (c) { html += cardHtml(c, col, ci); });
      } else if (filtering && col.cards.length) {
        html += '<p class="col-empty">' + esc(t("col.hidden", { n: col.cards.length })) + '</p>';
      } else {
        html += '<p class="col-empty">' + esc(t("col.empty")) + '</p>';
      }

      if (view.composing === col.id) {
        html += '<div class="composer">' +
          '<textarea id="composerInput" placeholder="' + esc(t("compose.ph")) + '" rows="2"></textarea>' +
          '<div class="composer-row">' +
            '<button class="btn btn-primary" type="button" data-compose-save="' + col.id + '">' +
              esc(t("compose.add")) + '</button>' +
            '<button class="btn btn-ghost" type="button" data-compose-cancel="1">' +
              esc(t("common.cancel")) + '</button>' +
            '<span class="hint">' + esc(t("compose.hint")) + '</span>' +
          '</div></div>';
      }

      html += '</div><div class="col-foot">' +
        '<button class="btn add-card" type="button" data-add="' + col.id + '">+&nbsp; ' +
          esc(t("board.addCard")) + '</button>' +
        '</div></section>';
    });

    html += '<button class="add-col" type="button" id="addCol">+&nbsp; ' +
      esc(t("board.addCol")) + '</button>';
    $("board").innerHTML = html;

    var total = Object.keys(state.cards).length;
    $("blankSlot").innerHTML = total === 0
      ? '<div class="blank"><h3>' + esc(t("blank.title")) + '</h3>' +
        '<p>' + esc(t("blank.body")) + '</p></div>'

    renderFilterPill();

  function askText(opts) {
    $("sheet").innerHTML =
      '<h2 id="sheetTitle">' + esc(opts.title) + '</h2>' +
      '<p class="sub"></p>' +
      '<div class="field"><label for="askInput">' + esc(opts.label) + '</label>' +

        '<button class="btn btn-primary" type="button" id="askOk">' +
          esc(opts.ok || t("common.ok")) + '</button>' +
      '</div>';

      var v = input.value.trim();
      closeSheet();

    $("backdrop").hidden = false;
    var list = $("sheet").querySelector(".log-list");
    if (list) list.scrollTop = list.scrollHeight;
    window.setTimeout(function () { $("fTitle").focus(); }, 20);
  }

  function closeEditor() { closeSheet(); }

  function saveEditor() {
    if (!editing) return;
    var card = state.cards[editing.id];
    if (!card) { closeEditor(); return; }
    var title = $("fTitle").value.trim();
    if (!title) { $("fTitle").focus(); return; }
    card.title = title;
    card.note = $("fNote").value.trim();
    card.due = $("fDue").value || "";
    card.pri = editing.pri;
    card.tags = $("fTags").value.split(",")
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x; })
      .slice(0, 8);

    // an update typed but not yet added shouldn't be lost on save
    var pending = $("logInput");
    if (pending && pending.value.trim()) {
      logOf(card).push({ id: uid("g"), text: pending.value.trim(), at: Date.now() });
    }

    var target = $("fCol").value;
    var here = colOf(card.id);
    closeEditor();
    if (target !== here.id) {
      moveCard(card.id, target, state.columns[colIndex(target)].cards.length);
    } else {
      commit();
    }
  }

  /* ═══ drag & drop ═══════════════════════════════════════════ */
  var dragId = null;
  var dropLine = null;

  function clearDropLine() {
    if (dropLine && dropLine.parentNode) dropLine.parentNode.removeChild(dropLine);
    dropLine = null;
    Array.prototype.forEach.call(document.querySelectorAll(".col-body.drag-over"), function (el) {
      el.classList.remove("drag-over");
    });
  }

  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    dragId = card.dataset.card;
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* older browsers */ }
  });

  document.addEventListener("dragend", function (e) {
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (card) card.classList.remove("dragging");
    dragId = null;
    clearDropLine();
  });

  document.addEventListener("dragover", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (!body || !dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";

    body.classList.add("drag-over");
    if (!dropLine) {
      dropLine = document.createElement("div");
      dropLine.className = "drop-line";
    }

    var cards = Array.prototype.filter.call(body.querySelectorAll(".card"), function (el) {
      return !el.classList.contains("dragging");
    });
    var after = null;
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { after = cards[i]; break; }
    }
    if (after) body.insertBefore(dropLine, after);
    else body.appendChild(dropLine);
  });

  document.addEventListener("dragleave", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (body && !body.contains(e.relatedTarget)) body.classList.remove("drag-over");
  });

  document.addEventListener("drop", function (e) {
    var body = e.target.closest ? e.target.closest(".col-body") : null;
    if (!body || !dragId) return;
    e.preventDefault();

    var colId = body.dataset.drop;
    var anchorId = null;
    if (dropLine && dropLine.parentNode === body) {
      var el = dropLine.nextElementSibling;
      while (el && !(el.classList && el.classList.contains("card"))) el = el.nextElementSibling;
      if (el && el.dataset.card !== dragId) anchorId = el.dataset.card;
    }

    var moving = dragId;
    clearDropLine();
    dragId = null;
    dropBefore(moving, colId, anchorId);
  });

  /* ═══ events ════════════════════════════════════════════════ */
  document.addEventListener("click", function (e) {
    var target = e.target;
    var hit;

    // Drive sync
    if (target.closest("#btnPush") || target.closest("#syncPush")) { drivePush(); return; }
    if (target.closest("#syncPull")) { drivePull(true); return; }

    // settings
    if (target.closest("#btnSettings")) { openSettings(); return; }
    hit = target.closest("[data-lang]");
    if (hit) {
      view.lang = hit.dataset.lang;
      saveUi();
      applyStatic();
      render();
      openSettings();
      return;
    }
    hit = target.closest("[data-font-opt]");
    if (hit) {
      view.font = hit.dataset.fontOpt;
      saveUi();
      applyStatic();
      openSettings();
      return;
    }
    if (target.closest("#setClose")) { closeSheet(); return; }

    // view tabs
    hit = target.closest("[data-page]");
    if (hit) {
      view.page = hit.dataset.page;
      view.menuFor = null;
      view.composing = null;
      saveUi();
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }

    // group / sort controls on the remaining page
    hit = target.closest("[data-group]");
    if (hit) { view.groupBy = hit.dataset.group; saveUi(); render(); return; }
    hit = target.closest("[data-sort]");
    if (hit) { view.sortBy = hit.dataset.sort; saveUi(); render(); return; }

    // activity log
    if (target.closest("#logAdd")) { submitLog(); return; }
    hit = target.closest("[data-log-del]");
    if (hit && editing) { deleteLogEntry(editing.id, hit.dataset.logDel); return; }

    // tick a task off from a summary row
    hit = target.closest("[data-complete]");
    if (hit) { completeCard(hit.dataset.complete); return; }

    // summary row → open the same editor the board uses
    hit = target.closest(".row[data-card]");
    if (hit) { openEditor(hit.dataset.card); return; }

    // pulse filters
    hit = target.closest("[data-filter]");
    if (hit) {
      var f = hit.dataset.filter;
      view.filter = (view.filter === f || f === "all") ? "all" : f;
      render();
      return;
    }

    if (target.closest("#clearFilter")) { view.filter = "all"; render(); return; }

    // column menu
    hit = target.closest("[data-menu]");
    if (hit) {
      view.menuFor = view.menuFor === hit.dataset.menu ? null : hit.dataset.menu;
      render();
      return;
    }

    hit = target.closest("[data-act]");
    if (hit) { runColAction(hit.dataset.act, hit.dataset.col); return; }

    if (view.menuFor && !target.closest("[data-menu-panel]")) { view.menuFor = null; render(); }

    // composer
    hit = target.closest("[data-add]");
    if (hit) { view.composing = hit.dataset.add; render(); return; }

    hit = target.closest("[data-compose-save]");
    if (hit) {
      var val = $("composerInput").value.trim();
      if (val) { addCard(hit.dataset.composeSave, val); view.composing = hit.dataset.composeSave; render(); }
      return;
    }

    if (target.closest("[data-compose-cancel]")) { view.composing = null; render(); return; }

    if (target.closest("#addCol")) {
      askText({
        title: t("addCol.title"),
        label: t("addCol.label"),
        placeholder: t("addCol.ph"),
        ok: t("addCol.title"),
        onOk: function (name) {
          state.columns.push({ id: uid("c"), title: name, done: false, cards: [] });
          commit();
        }
      });
      return;
    }

    // card nudge
    hit = target.closest("[data-nudge]");
    if (hit) { nudge(hit.dataset.card, Number(hit.dataset.nudge)); return; }

    // open card
    hit = target.closest(".card");
    if (hit) { openEditor(hit.dataset.card); return; }

    // editor controls
    hit = target.closest("[data-quick]");
    if (hit) {
      var q = hit.dataset.quick;
      $("fDue").value = q === "clear" ? "" : shiftIso(Number(q));
      return;
    }
    hit = target.closest("#fPri [data-v]");
    if (hit && editing) {
      editing.pri = hit.dataset.v;
      Array.prototype.forEach.call(document.querySelectorAll("#fPri [data-v]"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.v === editing.pri));
      });
      return;
    }
    if (target.closest("#fSave")) { saveEditor(); return; }
    if (target.closest("#fCancel")) { closeEditor(); return; }
    if (target.closest("#fDelete")) {
      var id = editing && editing.id;
      closeEditor();
      if (id) deleteCard(id);
      return;
    }
    if (target.id === "backdrop") { closeSheet(); return; }

    // toolbar
    if (target.closest("#clearSearch")) {
      $("search").value = "";
      view.query = "";
      $("clearSearch").hidden = true;
      render();
      return;
    }
    if (target.closest("#btnReset")) {
      askConfirm({
        title: t("reset.title"),
        body: t("reset.body"),
        ok: t("reset.ok"),
        danger: true,
        onOk: function () {
          state = seed();
          view.filter = "all";
          commit();
          toast(t("toast.reset"));
        }
      });
      return;
    }
    if (target.closest("#btnExport")) { doExport(); return; }
    if (target.closest("#btnImport")) { $("fileInput").click(); return; }
  });

  function runColAction(act, colId) {
    var i = colIndex(colId);
    var col = state.columns[i];
    if (!col) return;
    view.menuFor = null;
    render();

    if (act === "rename") {
      askText({
        title: t("rename.title"),
        label: t("addCol.label"),
        value: col.title,
        ok: t("common.save"),
        onOk: function (name) { col.title = name; commit(); }
      });
    } else if (act === "sort") {
      col.cards.sort(function (a, b) {
        var da = state.cards[a].due, db = state.cards[b].due;
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da < db ? -1 : da > db ? 1 : 0;
      });
      commit();
      toast(t("toast.sorted", { t: col.title }));
    } else if (act === "toggle-done") {
      col.done = !col.done;
      col.cards.forEach(function (id) {
        state.cards[id].doneAt = col.done ? (state.cards[id].doneAt || Date.now()) : 0;
      });
      commit();
    } else if (act === "clear") {
      if (!col.cards.length) { toast(t("toast.colEmpty")); return; }
      askConfirm({
        title: t("clearCol.title", { t: col.title }),
        body: t("clearCol.body", { n: col.cards.length }),
        ok: t("clearCol.ok", { n: col.cards.length }),
        danger: true,
        onOk: function () {
          col.cards.forEach(function (id) { delete state.cards[id]; });
          col.cards = [];
          commit();
        }
      });
    } else if (act === "del-col") {
      if (state.columns.length === 1) { toast(t("toast.needOneCol")); return; }
      var dest = state.columns[i === 0 ? 1 : 0];
      askConfirm({
        title: t("delCol.title", { t: col.title }),
        body: col.cards.length
          ? t("delCol.bodyMove", { n: col.cards.length, to: dest.title })
          : t("delCol.bodyEmpty"),
        ok: t("delCol.ok"),
        danger: true,
        onOk: function () {
          var at = colIndex(col.id);
          if (at === -1) return;
          dest.cards = dest.cards.concat(col.cards);
          if (!dest.done) col.cards.forEach(function (id) { state.cards[id].doneAt = 0; });
          state.columns.splice(at, 1);
          commit();
        }
      });
    }
  }

  /* ═══ keyboard ══════════════════════════════════════════════ */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("backdrop").hidden) { closeSheet(); return; }
      if (view.composing) { view.composing = null; render(); return; }
      if (view.menuFor) { view.menuFor = null; render(); return; }
    }

    if (e.target.id === "composerInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      var val = e.target.value.trim();
      if (val) addCard(view.composing, val);
      return;
    }

    // Ctrl+Enter in the log box adds an entry; elsewhere in the editor it saves
    if (e.target.id === "logInput" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      submitLog();
      return;
    }

    if (editing && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      saveEditor();
      return;
    }

    if (e.key === "Enter" && e.target.classList &&
        (e.target.classList.contains("card") || e.target.classList.contains("row"))) {
      e.preventDefault();
      openEditor(e.target.dataset.card);
    }
  });

  /* ═══ load-strip tooltip ════════════════════════════════════ */
  function showTip(dayBtn) {
    var tip = $("tip");
    var plot = $("plot");
    if (!tip || !plot) return;

    var iso = dayBtn.dataset.day;
    var due = openMatching().filter(function (c) { return c.due === iso; });
    var titles = due.slice(0, 3).map(function (c) {
      return esc(clip(c.title, 31));
    }).join("<br />");

    tip.innerHTML = '<b>' + esc(exactDate(iso)) + '</b> · ' + esc(t("tip.count", { n: due.length })) +
      (titles ? '<div class="t-list">' + titles +
        (due.length > 3 ? '<br />' + esc(t("tip.more", { n: due.length - 3 })) : "") + '</div>' : "");

    var pr = plot.getBoundingClientRect();
    var br = dayBtn.getBoundingClientRect();
    tip.hidden = false;

    // measure after the content is in — width and height both vary with the day
    var half = tip.offsetWidth / 2;
    var x = br.left - pr.left + br.width / 2;
    tip.style.left = Math.min(Math.max(x, half + 2), pr.width - half - 2) + "px";

    // sit above the bar, or flip below it when the caption is in the way
    var bar = dayBtn.querySelector(".bar").getBoundingClientRect();
    var caption = plot.parentNode.querySelector(".chart-caption");
    var ceiling = caption ? caption.getBoundingClientRect().bottom : pr.top;
    var above = bar.top - 8 - tip.offsetHeight;
    tip.style.top = (above >= ceiling ? above - pr.top : bar.bottom - pr.top + 8) + "px";
  }

  function hideTip() {
    var tip = $("tip");
    if (tip) tip.hidden = true;
  }

  document.addEventListener("mouseover", function (e) {
    var day = e.target.closest ? e.target.closest("[data-day]") : null;
    if (day) showTip(day);
  });
  document.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest("[data-day]")) hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var day = e.target.closest ? e.target.closest("[data-day]") : null;
    if (day) showTip(day);
  });
  document.addEventListener("focusout", function (e) {
    if (e.target.closest && e.target.closest("[data-day]")) hideTip();
  });

  $("search").addEventListener("input", function (e) {
    view.query = e.target.value;
    $("clearSearch").hidden = !e.target.value;
    render();
  });

  /* ═══ backup ════════════════════════════════════════════════ */
  function doExport() {
    var text = JSON.stringify(state, null, 2);
    var pretty = t("file.name") + "-" + todayIso() + ".json";

    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "board-" + todayIso() + ".json", data: text })
        .then(function () { toast(t("toast.saved")); })
        .catch(function (err) {
          if (err && err.code === "declined") return;
          fallbackDownload(pretty, text);
        });
      return;
    }
    fallbackDownload(pretty, text);
  }

  function fallbackDownload(name, text) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast(t("toast.saved"));
    } catch (e) {
      toast(t("toast.dlFail"));
    }
  }

  $("fileInput").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try { incoming = sanitize(JSON.parse(String(reader.result))); }
      catch (err) { incoming = null; }
      if (!incoming) { toast(t("toast.importBad")); return; }
      var n = Object.keys(incoming.cards).length;
      askConfirm({
        title: t("import.title"),
        body: t("import.body", { n: n }),
        ok: t("import.ok"),
        danger: true,
        onOk: function () {
          state = incoming;
          view.filter = "all";
          commit();
          toast(t("toast.imported", { n: n }));
        }
      });
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ═══ boot ══════════════════════════════════════════════════ */
  if (!canStore) showWarn(t("warn.noStore"));

  window.addEventListener("resize", sizeBoard);

  applyStatic();
  save();
  render();
  renderSync();
  drivePull(false);
})();
</script>
