<title>AutoInspection Page Audit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --border:#d7dee6;
  --text:#16212c; --text-dim:#5b6b7a;
  --accent:#1f6fb2; --accent-soft:#e4f0fb;
  --ok:#1f8a5c; --ok-soft:#e3f5ec;
  --warn:#a85e10; --warn-soft:#fbf0dd;
  --danger:#c23b34; --danger-soft:#fbe6e4;
  --dash:#b9c4cf;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --surface:#16212c; --surface-2:#1c2933; --border:#2a3947;
    --text:#e7edf3; --text-dim:#92a3b2;
    --accent:#5aacf2; --accent-soft:#16324a;
    --ok:#3ecf8e; --ok-soft:#113224;
    --warn:#e8a839; --warn-soft:#3a2c0f;
    --danger:#ef6b63; --danger-soft:#3a1613;
    --dash:#3a4d5e;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#16212c; --surface-2:#1c2933; --border:#2a3947;
  --text:#e7edf3; --text-dim:#92a3b2;
  --accent:#5aacf2; --accent-soft:#16324a;
  --ok:#3ecf8e; --ok-soft:#113224;
  --warn:#e8a839; --warn-soft:#3a2c0f;
  --danger:#ef6b63; --danger-soft:#3a1613;
  --dash:#3a4d5e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font-family:inherit}
::selection{background:var(--accent-soft)}

header.top{
  height:58px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:5;
}
header.top .brand{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;white-space:nowrap}
header.top .brand small{display:block;font-weight:400;color:var(--text-dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.stat-row{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.stat .n{font-variant-numeric:tabular-nums}
.stat.fix{background:var(--danger-soft);color:var(--danger)}
.stat.improve{background:var(--warn-soft);color:var(--warn)}
.stat.drift{background:var(--accent-soft);color:var(--accent)}
.stat.clean{background:var(--ok-soft);color:var(--ok)}

.layout{display:grid;grid-template-columns:252px 1fr;min-height:calc(100vh - 58px)}
nav.rail{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto}
nav.rail input{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);
  color:var(--text);font-family:var(--sans);font-size:12.5px;margin-bottom:12px;
}
nav.rail input:focus{outline:2px solid var(--accent);outline-offset:1px}
.rail-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;
  border-radius:6px;padding:6.5px 9px;color:var(--text);cursor:pointer;font-size:12.5px;font-family:var(--sans);
}
.rail-item:hover{background:var(--surface-2)}
.rail-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
.rail-item .dot.fix{background:var(--danger)}
.rail-item .dot.improve{background:var(--warn)}
.rail-item .dot.drift{background:var(--accent)}
.rail-item .dot.clean{background:var(--dash)}
.rail-item span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-label{
  font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
  margin:14px 0 5px 9px;
}
.group-label:first-child{margin-top:2px}

main{padding:26px 30px 60px;overflow-x:hidden;max-width:1180px}
h1{font-family:var(--mono);font-size:22px;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--mono);font-size:18px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--text-dim);max-width:64ch;margin:0 0 26px}
.path{font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}

.section-title{
  font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
  margin:30px 0 12px;
}
.section-title:first-of-type{margin-top:0}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.summary-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
}
.summary-card .num{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.summary-card .label{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.summary-card.fix .num{color:var(--danger)}
.summary-card.improve .num{color:var(--warn)}
.summary-card.drift .num{color:var(--accent)}
.summary-card.clean .num{color:var(--ok)}

.finding-card{
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);
  border-radius:9px;padding:14px 16px;margin-bottom:12px;
}
.finding-card.fix{border-left-color:var(--danger)}
.finding-card.improve{border-left-color:var(--warn)}
.finding-card.drift{border-left-color:var(--accent)}
.finding-card .fc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.finding-card .fc-page{font-weight:600;font-size:13.5px}
.finding-card .fc-rule{font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
.finding-card p{margin:5px 0}
.finding-card .loc{font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}
.finding-card .fix-line{color:var(--text)}
.finding-card .fix-line b{color:var(--ok);font-weight:600}

.note-card{background:var(--surface-2);border:1px dashed var(--border);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.note-card h3{margin:0 0 6px;font-size:13.5px;font-family:var(--mono)}
.note-card p{margin:0;color:var(--text-dim)}

.pill{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:999px;text-transform:uppercase;
}
.pill.fix{background:var(--danger-soft);color:var(--danger)}
.pill.improve{background:var(--warn-soft);color:var(--warn)}
.pill.drift{background:var(--accent-soft);color:var(--accent)}
.pill.clean{background:var(--ok-soft);color:var(--ok)}

.page-view{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.page-view{grid-template-columns:1fr}}

.capture-frame{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
}
.capture-frame .cf-bar{
  height:32px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:6px;padding:0 12px;
}
.cf-bar .cf-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.cf-bar .cf-label{margin-left:8px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim)}
.capture-body{padding:16px;background:var(--bg);max-height:70vh;overflow:auto}

/* capture render primitives (mirrors the app's own layout vocabulary at a glance) */
.capture-body .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:start}
.capture-body .stack{display:flex;gap:8px}
.capture-body .stack.column{flex-direction:column}
.capture-body .stack.row{flex-direction:row;flex-wrap:wrap;align-items:center}
.capture-body .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;min-width:0}
.capture-body .text{padding:2px 0;color:var(--text);font-size:12.5px;line-height:1.35}
.capture-body .button{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:6px 10px;color:var(--accent);font-size:12px}
.capture-body .field{display:block;min-width:120px;flex:1;padding:3px 0;color:var(--text-dim);font-size:10.5px}
.capture-body .field span{display:block;margin-bottom:3px}
.capture-body .field input,.capture-body .field select{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font-size:11.5px}
.capture-body .check{padding:5px 0;color:var(--text);font-size:12px}
.capture-body .notice{padding:8px 10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border);border-radius:6px;margin:4px 0;font-size:12px}
.capture-body .progress{color:var(--accent);font-size:20px;padding:6px}
.capture-body .media{min-height:80px;background:var(--surface-2);color:var(--text-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;margin:3px 0;font-size:11.5px}
.capture-body details{border:1px solid var(--border);border-radius:7px;padding:7px;margin:3px 0;background:var(--surface)}
.capture-body summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
.capture-body .list{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:6px;min-height:30px}
.capture-body .list-row{padding:7px;border-bottom:1px solid var(--surface-2);color:var(--text-dim);font-size:11.5px}
.capture-body .frame{min-height:110px;border:1px dashed var(--dash);border-radius:7px;color:var(--text-dim);display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:11.5px}
.capture-body .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent)}

.findings-col .empty-clean{
  background:var(--ok-soft);border:1px solid var(--border);border-radius:9px;padding:14px 16px;color:var(--ok);
  font-size:12.5px;
}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab{
  font-family:var(--mono);font-size:12px;padding:8px 4px;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--text-dim);cursor:pointer;margin-right:16px;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}
.view.active{display:block}
a{color:var(--accent)}
footer.foot{color:var(--text-dim);font-size:11.5px;margin-top:36px;border-top:1px solid var(--border);padding-top:14px;font-family:var(--mono)}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  nav.rail{position:static;max-height:280px}
  header.top{flex-wrap:wrap;height:auto;padding:10px 16px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<header class="top">
  <div class="brand">AUTOINSPECTION · PAGE AUDIT<small>AoiStudio.WinUI · 36 screens</small></div>
  <div class="stat-row" id="statRow"></div>
</header>

<div class="layout">
  <nav class="rail">
    <input id="filterInput" placeholder="Filter pages…" oninput="renderRail(this.value)">
    <div id="railList"></div>
  </nav>
  <main id="main"></main>
</div>

roupOrder": ["Shell & controls", "Configuration", "Flow", "Manual", "Monitor", "Root pages"]}</script>
<script>
const DATA = JSON.parse(document.getElementById('audit-data').textContent);
const SEV_LABEL = {fix:'Fix', improve:'Improve', drift:'Doc drift', clean:'Clean'};

function severityOf(title){
  return DATA.findings[title] ? DATA.findings[title].severity : 'clean';
}
function countBy(sev){
  return DATA.pages.filter(p => severityOf(p.title) === sev).length;
}

let currentView = 'overview';
let currentPage = null;

function renderStatRow(){
  const row = document.getElementById('statRow');
  row.innerHTML = ['fix','improve','drift','clean'].map(sev => {
    const n = sev === 'clean' ? countBy('clean') : countBy(sev);
    return `<button class="stat ${sev}" onclick="goOverview('${sev}')" style="border:0;cursor:pointer"><span class="n">${n}</span> ${SEV_LABEL[sev]}</button>`;
  }).join('');
}

function renderRail(filter){
  filter = (filter || '').toLowerCase();
  const list = document.getElementById('railList');
  let html = `<button class="rail-item ${currentView==='overview' ? 'active' : ''}" onclick="goOverview()"><span class="dot" style="background:var(--accent)"></span><span class="name">Overview</span></button>`;
  for (const group of DATA.groupOrder){
    const items = DATA.pages.filter(p => p.group === group && p.title.toLowerCase().includes(filter));
    if (!items.length) continue;
    html += `<div class="group-label">${group}</div>`;
    for (const p of items){
      const sev = severityOf(p.title);
      const active = currentView === 'page' && currentPage === p.title ? 'active' : '';
      html += `<button class="rail-item ${active}" onclick="goPage('${p.title.replace(/'/g,"\\'")}')"><span class="dot ${sev}"></span><span class="name">${p.title}</span></button>`;
    }
  }
  list.innerHTML = html;
}

function renderCapture(tree){
  return `<div class="capture-frame"><div class="cf-bar"><span class="cf-dot"></span><span class="cf-dot"></span><span class="cf-dot"></span><span class="cf-label">rendered from current XAML — layout only, not final pixel fidelity</span></div><div class="capture-body">${tree || '<div class="text" style="color:var(--text-dim)">No visual content in this file (root/window shell).</div>'}</div></div>`;
}

function findingsHtml(title){
  const f = DATA.findings[title];
  if (!f) return `<div class="empty-clean">${DATA.cleanNote}</div>`;
  return f.items.map(item => `
    <div class="finding-card ${f.severity}">
      <div class="fc-head"><span class="pill ${f.severity}">${SEV_LABEL[f.severity]}</span><span class="fc-rule">${item.rule}</span></div>
      <p class="loc">${item.loc}</p>
      <p>${item.issue}</p>
      <p class="fix-line"><b>Fix →</b> ${item.fix}</p>
    </div>`).join('');
}

function goPage(title){
  currentView = 'page';
  currentPage = title;
  render();
}
function goOverview(){
  currentView = 'overview';
  currentPage = null;
  render();
  if (arguments.length && arguments[0]) {
    setTimeout(() => {
      const el = document.getElementById('sev-' + arguments[0]);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 30);
  }
}

function renderOverview(){
  const main = document.getElementById('main');
  const total = DATA.pages.length;
  const fix = countBy('fix'), improve = countBy('improve'), drift = countBy('drift'), clean = countBy('clean');
  let html = `
    <h1>Designer audit — AutoInspection WinUI 3 pages</h1>
    <p class="lede">${total} screens captured from the current <code>src/AoiStudio.WinUI</code> XAML on this branch and checked against this repo's own <code>winui3-modernization</code> skill (theme-resource rule + native-control table). Click any page on the left for its capture and notes.</p>

    <div class="summary-grid">
      <div class="summary-card fix"><div class="num">${fix}</div><div class="label">need a fix</div></div>
      <div class="summary-card improve"><div class="num">${improve}</div><div class="label">worth improving</div></div>
      <div class="summary-card drift"><div class="num">${drift}</div><div class="label">doc drift only</div></div>
      <div class="summary-card clean"><div class="num">${clean}</div><div class="label">clean pass</div></div>
    </div>

    <div class="section-title" id="sev-fix">Needs a fix</div>
    ${DATA.pages.filter(p=>severityOf(p.title)==='fix').map(p => pageFindingBlock(p.title)).join('')}

    <div class="section-title" id="sev-improve">Worth improving</div>
    ${DATA.pages.filter(p=>severityOf(p.title)==='improve').map(p => pageFindingBlock(p.title)).join('')}

    <div class="note-card"><h3>${DATA.crossPage.title}</h3><p>${DATA.crossPage.body}</p></div>

    <div class="section-title" id="sev-drift">Documentation drift (winui3-modernization skill)</div>
    ${DATA.pages.filter(p=>severityOf(p.title)==='drift').map(p => pageFindingBlock(p.title)).join('')}

    <div class="section-title">How this capture was made</div>
    <div class="note-card"><h3>${DATA.meta.title}</h3><p>${DATA.meta.body}</p></div>

    <footer class="foot">AoiStudio.WinUI is Windows-only (Windows App SDK) — these are XAML-structure renders, not pixel-accurate screenshots from a running build. Use them to confirm layout, copy and control choices; verify final visuals on a Windows machine.</footer>
  `;
  main.innerHTML = html;
}

function pageFindingBlock(title){
  const p = DATA.pages.find(x => x.title === title);
  const f = DATA.findings[title];
  return `<div class="finding-card ${f.severity}">
    <div class="fc-head"><span class="fc-page">${title}</span><span class="path">${p.path}</span></div>
    ${f.items.map(item => `<p class="loc">${item.loc}</p><p>${item.issue}</p><p class="fix-line"><b>Fix →</b> ${item.fix}</p>`).join('')}
    <p><button class="tab" style="margin:4px 0 0" onclick="goPage('${title.replace(/'/g,"\\'")}')">View capture →</button></p>
  </div>`;
}

function renderPage(title){
  const p = DATA.pages.find(x => x.title === title);
  const f = DATA.findings[title];
  const sev = f ? f.severity : 'clean';
  const main = document.getElementById('main');
  main.innerHTML = `
    <h2>${title} <span class="pill ${sev}" style="margin-left:6px">${SEV_LABEL[sev]}</span></h2>
    <p class="path">${p.path}</p>
    <div class="page-view" style="margin-top:18px">
      <div class="capture-col">${renderCapture(p.tree)}</div>
      <div class="findings-col">${findingsHtml(title)}</div>
    </div>
  `;
}

function render(){
  renderStatRow();
  renderRail(document.getElementById('filterInput').value);
  if (currentView === 'overview') renderOverview();
  else renderPage(currentPage);
}

render();
</script>
